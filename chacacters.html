<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ICS Cartoon Teacher — Glasses & Refined Face</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#dce6ef;color:#172438}#scene{display:block;width:100%;height:100%;touch-action:none}.ui{position:fixed;top:22px;left:22px;max-width:310px;padding:19px 22px;background:#ffffffdf;border:2px solid #253449;border-radius:17px;box-shadow:0 12px 35px #24344c24}.ui h1{margin:0 0 7px;font-size:23px}.ui p{margin:0;font-size:13px;line-height:1.5;color:#44566b}.actions{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:calc(100% - 24px)}button{border:2px solid #18283c;background:#fff;color:#172438;padding:12px 16px;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 5px 0 #18283c}button:active{transform:translateY(3px);box-shadow:0 2px 0 #18283c}button.active{background:#ff9b3c}#error{display:none;position:fixed;inset:0;place-items:center;text-align:center;padding:24px;background:#fff;font-size:18px}@media(max-width:550px){.ui{top:10px;left:10px;right:10px;max-width:none;padding:10px 14px}.ui h1{font-size:17px}.ui p{font-size:11px}.actions{bottom:12px}button{font-size:12px;padding:10px}}
</style>
</head>
<body>
<canvas id="scene" aria-label="Interactive cartoon teacher 3D preview"></canvas>
<div class="ui"><h1>👋 ICS Cartoon Teacher</h1><p>Cartoon teacher with black rounded glasses, a slightly lighter warm tan, refined smile, and a clean bald head.<br>Drag to rotate • Scroll to zoom</p></div>
<div class="actions"><button id="wave" class="active">👋 Wave</button><button id="idle">🙂 Idle</button><button id="spin">🔄 Turn around</button><button id="reset">↺ Reset view</button></div>
<div id="error">3D engine couldn't load. Connect to the internet and reload this page.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
if(!window.THREE){document.getElementById('error').style.display='grid';throw Error('Three.js not loaded');}
const canvas=document.getElementById('scene');const scene=new THREE.Scene();scene.background=new THREE.Color('#dce6ef');
const camera=new THREE.PerspectiveCamera(34,1,.1,100);camera.position.set(0,2.65,10.5);
let renderer;try{renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});}catch(e){document.getElementById('error').style.display='grid';throw e;}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.88;
scene.add(new THREE.HemisphereLight(0xffffff,0x7c91aa,.55));const key=new THREE.DirectionalLight(0xffffff,.83);key.position.set(-4,8,6);key.castShadow=true;key.shadow.mapSize.set(1024,1024);key.shadow.camera.left=-7;key.shadow.camera.right=7;key.shadow.camera.top=9;key.shadow.camera.bottom=-7;scene.add(key);const rim=new THREE.DirectionalLight(0x9bcfff,.28);rim.position.set(5,5,-4);scene.add(rim);
const mat=(c,roughness=.88)=>new THREE.MeshStandardMaterial({color:c,roughness,metalness:0});const skin=mat('#d18b5c'),skinLight=mat('#dfa174'),hoodie=mat('#24222b'),hoodieLight=mat('#34313b'),hoodieDark=mat('#17161c'),jeans=mat('#315789'),jeansLight=mat('#416ca4'),shoe=mat('#1d1b25'),sole=mat('#f4f2ed'),hair=mat('#242128'),white=mat('#fffdf6'),iris=mat('#573425'),black=mat('#0b0b10');
const teacher=new THREE.Group();scene.add(teacher);teacher.position.y=.02;
function add(parent,geo,material,x=0,y=0,z=0){const o=new THREE.Mesh(geo,material);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o;}
function sphere(p,m,x,y,z,sx,sy,sz){const o=add(p,new THREE.SphereGeometry(1,28,20),m,x,y,z);o.scale.set(sx,sy,sz);return o;}
function box(p,m,x,y,z,sx,sy,sz,r=0){const o=add(p,new THREE.BoxGeometry(sx,sy,sz),m,x,y,z);o.rotation.z=r;return o;}
function capsuleBetween(p,m,a,b,r){const v1=new THREE.Vector3(...a),v2=new THREE.Vector3(...b),d=new THREE.Vector3().subVectors(v2,v1);const o=add(p,new THREE.CylinderGeometry(r,r,d.length(),16),m,...v1.clone().add(v2).multiplyScalar(.5).toArray());o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());sphere(p,m,...a,r,r,r);sphere(p,m,...b,r,r,r);return o;}
function outlineSphere(p,x,y,z,sx,sy,sz){const shell=new THREE.Mesh(new THREE.SphereGeometry(1,28,20),new THREE.MeshBasicMaterial({color:0x14141b,side:THREE.BackSide}));shell.position.set(x,y,z);shell.scale.set(sx*1.047,sy*1.047,sz*1.047);p.add(shell);}
// Oversized cartoon sneakers, jeans and chunky hoodie.
for(const s of [-1,1]){
 sphere(teacher,shoe,s*.35,.18,.19,.32,.17,.55);sphere(teacher,sole,s*.35,.085,.24,.34,.09,.57);
 sphere(teacher,jeans,s*.35,.94,0,.285,.85,.31);sphere(teacher,jeansLight,s*.35,.38,.04,.29,.19,.32);
}
sphere(teacher,hoodie,0,2.25,0,.90,.96,.54);sphere(teacher,hoodieLight,0,2.9,-.18,.69,.35,.48);sphere(teacher,hoodieDark,0,1.52,0,.76,.15,.48);
// Kangaroo pocket and hoodie drawstrings.
sphere(teacher,hoodieLight,0,1.94,.51,.55,.30,.075);for(const s of [-1,1])capsuleBetween(teacher,hoodieDark,[s*.14,2.92,.53],[s*.14,2.42,.59],.035);
// Arms: left rests at pocket, right is animated at the shoulder.
capsuleBetween(teacher,hoodie,[-.74,2.69,0],[-.98,1.96,.25],.27);
capsuleBetween(teacher,skin,[-.98,1.96,.25],[-.53,1.91,.57],.18);
const rightArm=new THREE.Group();rightArm.position.set(.73,2.68,0);teacher.add(rightArm);
capsuleBetween(rightArm,hoodie,[0,0,0],[.45,-.43,.18],.27);capsuleBetween(rightArm,skin,[.45,-.43,.18],[.89,-.20,.49],.18);
const hand=sphere(rightArm,skinLight,.98,-.17,.52,.26,.15,.30);hand.rotation.z=.35;
for(let i=0;i<4;i++)capsuleBetween(rightArm,skinLight,[1.03,-.11+i*.064,.65],[1.32,-.06+i*.065,.67],.045);
capsuleBetween(rightArm,skinLight,[.89,-.22,.63],[.92,.02,.78],.08);
// FACE V4 — flat, cohesive cartoon facial features, not floating spheres.
// All features are layered against a broad warm face panel, with a single beard shape.
const face=new THREE.Group();teacher.add(face);
const beard=mat('#302a35'),beardDark=mat('#211d27'),cheek=mat('#d89669');
const smileDark=mat('#24171a'),teeth=mat('#fff9ed');
function curvedLine(parent,points,material,radius=.025){
 const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));
 return add(parent,new THREE.TubeGeometry(curve,36,radius,8,false),material);
}
// Bald head and neck: a warm, broad oval with no protruding eye sockets.
sphere(face,skin,0,3.13,0,.29,.30,.29);
sphere(face,skin,0,3.82,.03,.73,.77,.55);
// Removed the black outline shell around the bald head.
for(const side of [-1,1]){
 sphere(face,skin,side*.69,3.72,.055,.145,.20,.115);
 sphere(face,cheek,side*.738,3.72,.151,.055,.095,.018);
}
// One smooth, broad beard cap hugs the lower front of the face.
// The upper face remains visible, rather than having separate beard "rocks".
sphere(face,beard,0,3.505,.355,.605,.345,.236);
sphere(face,beard,0,3.37,.35,.45,.20,.23);
for(const side of [-1,1]){
 // Beard rising naturally along each jawline.
 const sideBeard=sphere(face,beard,side*.45,3.55,.305,.155,.235,.19);
 sideBeard.rotation.z=-side*.23;
 // Warm cheeks overlap beard edge and integrate into the head.
 sphere(face,skin,side*.385,3.765,.455,.225,.19,.07);
}
// Small integrated nose (a flattened oval, not a floating round ball).
sphere(face,skinLight,0,3.805,.563,.125,.075,.038);
// Smile: a shallow dark curved mouth with one narrow row of teeth.
// Mouth parts sit on the beard surface, so there is no giant open oval.
sphere(face,smileDark,0,3.552,.574,.285,.071,.024);
sphere(face,teeth,0,3.566,.600,.252,.037,.012);
curvedLine(face,[[-.33,3.59,.579],[-.21,3.48,.597],[0,3.465,.600],[.21,3.48,.597],[.33,3.59,.579]],beardDark,.019);
// Compact moustache above the smile, two joined lobes.
for(const side of [-1,1]){
 const moustache=sphere(face,beardDark,side*.13,3.675,.576,.15,.042,.028);
 moustache.rotation.z=side*.14;
}
// Eyes: flat white ovals placed against the face, with thin pupils and no bulging sockets.
const eyelids=[];
for(const side of [-1,1]){
 const x=side*.285;
 sphere(face,white,x,4.085,.467,.176,.191,.035);
 sphere(face,iris,x-side*.014,4.077,.502,.091,.111,.018);
 sphere(face,black,x-side*.014,4.075,.520,.055,.075,.011);
 sphere(face,white,x-side*.038,4.123,.533,.023,.027,.008);
 const brow=sphere(face,beardDark,x,4.33,.405,.185,.040,.030);
 brow.rotation.z=-side*.13;
 const lid=sphere(face,skin,x,4.09,.511,.185,.18,.029);
 lid.visible=false;eyelids.push(lid);
}
// Rounded rectangular black glasses, fitted closely to the eyes (not floating).
const glassesMat = new THREE.MeshStandardMaterial({color:'#18171d',roughness:.48,metalness:.12});
function glassesFrame(cx){
 const w=.205,h=.195,r=.065,z=.545,cy=4.085;
 const pts=[
  [cx-w+r,cy+h,z],[cx+w-r,cy+h,z],
  [cx+w,cy+h-r,z],[cx+w,cy-h+r,z],
  [cx+w-r,cy-h,z],[cx-w+r,cy-h,z],
  [cx-w,cy-h+r,z],[cx-w,cy+h-r,z],[cx-w+r,cy+h,z]
 ];
 curvedLine(face,pts,glassesMat,.018);
}
glassesFrame(-.285);glassesFrame(.285);
curvedLine(face,[[-.08,4.105,.557],[0,4.12,.57],[.08,4.105,.557]],glassesMat,.019);
for(const side of [-1,1]){
 curvedLine(face,[[side*.49,4.105,.548],[side*.60,4.115,.44],[side*.72,4.10,.20]],glassesMat,.018);
}
// Character body and animation controls are unchanged.
// Floor and soft shadow.
const floor=add(scene,new THREE.CylinderGeometry(3.1,3.1,.12,64),mat('#f3f7fa'),0,-.12,0);floor.castShadow=false;floor.receiveShadow=true;
const ring=add(scene,new THREE.TorusGeometry(2.45,.025,8,90),mat('#f0a25d'),0,-.046,0);ring.rotation.x=-Math.PI/2;
let mode='wave',yaw=0,zoom=10.5,dragging=false,lastX=0;
const buttons=['wave','idle','spin'];function setMode(next){mode=next;buttons.forEach(id=>document.getElementById(id).classList.toggle('active',id===next));}
buttons.forEach(id=>document.getElementById(id).onclick=()=>setMode(id));
document.getElementById('reset').onclick=()=>{yaw=0;zoom=10.5;setMode('wave');};
canvas.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!dragging)return;yaw+=(e.clientX-lastX)*.008;lastX=e.clientX;});
canvas.addEventListener('pointerup',()=>dragging=false);canvas.addEventListener('pointercancel',()=>dragging=false);
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(7,Math.min(15,zoom+e.deltaY*.012));},{passive:false});
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();
 if(mode==='spin')yaw+=.008;
 teacher.rotation.y=yaw;
 teacher.position.y=.02+Math.sin(t*1.5)*.022;
 rightArm.rotation.z=mode==='wave' ? Math.sin(t*4.7)*.22+.18 : -.23;
 rightArm.rotation.x=mode==='wave' ? Math.sin(t*4.7)*.12 : 0;
 const blinking=(t%4.1)>3.96;eyelids.forEach(l=>l.visible=blinking);
 camera.position.set(0,2.45,zoom);camera.lookAt(0,2.23,0);renderer.render(scene,camera);
}animate();
</script>
</body></html>
