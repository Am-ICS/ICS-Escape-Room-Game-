<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RIT Computer Studies — 3D Welcome</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#353941;font-family:Arial,sans-serif;color:#f3f6fa}
.screen{position:relative;width:100%;height:100dvh;overflow:hidden;isolation:isolate}
#lab3d,#fallback{position:absolute;inset:0;width:100%;height:100%;display:block}
#fallback{display:none;background:linear-gradient(125deg,#777a7d,#545965 55%,#333944)}
.screen:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(5,13,22,.45),transparent 43%,rgba(4,12,20,.34)),linear-gradient(0deg,rgba(4,11,19,.42),transparent 35%);z-index:1}
.heading{position:absolute;left:4%;top:7%;z-index:3;max-width:64%;text-shadow:0 3px 20px #000b}
.heading .eyebrow{display:block;color:#90d7d3;font:800 11px monospace;letter-spacing:3px;margin-bottom:13px}
.heading strong{display:block;font-size:clamp(25px,3.2vw,49px);letter-spacing:-.035em;line-height:1.06;max-width:700px}
.heading .subtitle{display:block;font-size:clamp(12px,1.1vw,15px);color:#cad7e3;margin-top:12px;letter-spacing:.02em}
.menu{position:absolute;right:5%;top:50%;transform:translateY(-50%);width:min(30%,360px);z-index:4;padding:23px;border:1px solid #ffffff28;border-radius:19px;background:linear-gradient(145deg,#152433ee,#101b29ee);box-shadow:0 25px 75px #0008,0 0 0 1px #0005;backdrop-filter:blur(12px);display:flex;flex-direction:column;gap:11px}
.menu-title{font-size:11px;letter-spacing:2.5px;color:#93b8c9;font-weight:900;margin-bottom:7px}
.menu button{width:100%;text-align:left;display:flex;align-items:center;gap:13px;padding:15px 13px;border:1px solid #54718a88;border-radius:10px;background:#253a4b;color:#f4f8fc;font-size:clamp(12px,1.05vw,15px);font-weight:750;cursor:pointer;transition:background .2s,transform .2s,border-color .2s,box-shadow .2s}
.menu button .emoji{font-size:21px}.menu button .arrow{margin-left:auto;color:#a9d6e4;font-size:18px}
.menu button:hover,.menu button:focus-visible{background:#30536a;border-color:#8bd8c5;transform:translateX(3px);box-shadow:0 0 18px #53c8b52c;outline:none}
.menu-foot{font:11px monospace;color:#92aaba;margin-top:7px;line-height:1.5}
.teacher-card{position:absolute;left:4%;bottom:4%;width:min(50vw,500px);z-index:4;border:1px solid #ffffff45;border-radius:15px;overflow:hidden;box-shadow:0 18px 45px #0009;background:#1c2938}
.teacher{display:block;width:100%;max-height:300px;object-fit:cover;object-position:center bottom}
.teacher-caption{padding:10px 13px;background:#132333e8;font-size:12px;font-weight:800;color:#e5f2f9;line-height:1.35}
.teacher-caption span{display:block;color:#8fcfcb;font-size:10px;letter-spacing:1.5px;margin-bottom:3px}
#transition{position:fixed;inset:0;background:#07121d;z-index:20;opacity:0;pointer-events:none;transition:opacity 1.15s ease}#transition.show{opacity:1;pointer-events:all}
@media(max-width:760px){.heading{left:5%;top:5%;max-width:90%}.heading strong{font-size:clamp(23px,5.5vw,38px)}.menu{width:90%;left:5%;right:auto;top:auto;bottom:3%;transform:none;padding:13px;gap:7px}.menu button{padding:10px 12px}.menu-title,.menu-foot{display:none}.teacher-card{left:5%;bottom:43%;width:min(39vw,190px)}.teacher{max-height:145px}.teacher-caption{font-size:10px;padding:7px}}
@media(prefers-reduced-motion:reduce){#transition{transition:opacity .15s}}
</style>
</head>
<body>
<div class="screen">
  <canvas id="lab3d" aria-label="3D recreation of the real RIT computer classroom"></canvas>
  <div id="fallback"></div>
  <div class="heading"><span class="eyebrow">RIT // INFORMATION & COMPUTER STUDIES</span><strong>WELCOME TO<br>COMPUTER STUDIES</strong><span class="subtitle">Explore a familiar computer lab. Choose where to begin.</span></div>
  <div class="teacher-card"><img class="teacher" src="BaldGuyBlink.gif" alt="Animated RIT ICS teacher" onerror="this.parentElement.style.display='none'"><div class="teacher-caption"><span>YOUR ICS GUIDE</span>Hey! Welcome to the lab 👋</div></div>
  <div class="menu"><div class="menu-title">EXPLORE THE CLASSROOM</div>
    <button type="button" onclick="choose('lab')"><span class="emoji">💻</span>Computer lab access <span class="arrow">›</span></button>
    <button type="button" onclick="choose('course')"><span class="emoji">📖</span>Course information <span class="arrow">›</span></button>
    <button type="button" onclick="choose('security')"><span class="emoji">🛡️</span>Security system demo <span class="arrow">›</span></button>
    <div class="menu-foot">ICS LAB · SELECT AN OPTION TO CONTINUE</div>
  </div>
</div>
<div id="transition" aria-hidden="true"></div>
<script src="disablekeyboard.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
let transitioning = false;
function navigateSmoothly(destination) {
  if (transitioning) return;
  transitioning = true;
  document.getElementById('transition').classList.add('show');
  setTimeout(() => { window.location.href = destination; }, 1150);
}
function choose(option) {
  const pages = {lab:'lab.html', course:'course.html', security:'hallway.html'};
  if (Object.prototype.hasOwnProperty.call(pages, option)) navigateSmoothly(pages[option]);
}

function startClassroom() {
  const fallback = document.getElementById('fallback');
  if (typeof THREE === 'undefined') { fallback.style.display = 'block'; return; }
  let renderer;
  try { renderer = new THREE.WebGLRenderer({canvas:document.getElementById('lab3d'),antialias:true}); }
  catch (error) { fallback.style.display = 'block'; return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.6));
  renderer.setSize(innerWidth, innerHeight, false);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = .92;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x777b80);
  const camera = new THREE.PerspectiveCamera(66,innerWidth/innerHeight,.1,90);
  const material = (color,roughness=.88,metalness=0) => new THREE.MeshStandardMaterial({color,roughness,metalness});
  const M = {
    wall:material(0xb9b8b4), floor:material(0xa9a9a6), ceiling:material(0xc5c3be),
    seam:material(0x777774), wood:material(0xc49a68), woodEdge:material(0x95714b),
    black:material(0x191c20,.58), chair:material(0x303239), metal:material(0x777b80,.42,.5),
    table:material(0xe0e0dc), trim:material(0xaaa9a5), tv:material(0x101319,.27),
    screen:material(0x171c27,.3), purple:new THREE.MeshBasicMaterial({color:0x6d50cb}),
    light:new THREE.MeshBasicMaterial({color:0xdde8ed})
  };
  function box(w,h,d,x,y,z,mat,shadow=false) {
    const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
    mesh.position.set(x,y,z);mesh.castShadow=shadow;mesh.receiveShadow=true;scene.add(mesh);return mesh;
  }
  function cylinder(radius,height,x,y,z,mat,segments=12) {
    const mesh=new THREE.Mesh(new THREE.CylinderGeometry(radius,radius,height,segments),mat);
    mesh.position.set(x,y,z);mesh.castShadow=true;scene.add(mesh);return mesh;
  }
  // Room proportions and viewpoint follow the supplied real classroom photo.
  // Front wall is z=-12; camera looks inward from the doorway.
  box(16,.14,25,0,-.09,0,M.floor);
  box(16,7.2,.18,0,3.6,-12,M.wall);
  box(.18,7.2,25,-8,3.6,0,M.wall);
  box(.18,7.2,25,8,3.6,0,M.wall);
  box(16,.12,25,0,7.22,0,M.ceiling);
  // Light gray square vinyl floor tiles.
  for(let x=-8;x<=8;x+=1.25) box(.009,.012,25,x,.003,0,M.seam);
  for(let z=-12;z<=12;z+=1.25) box(16,.012,.009,0,.003,z,M.seam);
  // Acoustic drop ceiling grid and subtly varied square tiles.
  for(let x=-8;x<=8;x+=1.25) box(.025,.024,25,x,7.135,0,M.trim);
  for(let z=-12;z<=12;z+=1.25) box(16,.024,.025,0,7.135,z,M.trim);
  // Rectangular fluorescent panels (not overly bright).
  for(const [x,z] of [[-4.5,6.5],[-3.2,-3],[4.2,-5],[4.1,5]]) {
    box(1.08,.04,2.35,x,7.08,z,M.metal);
    box(.93,.015,2.15,x,7.055,z,M.light);
    const lamp=new THREE.PointLight(0xe4e9ef,.32,10,2);
    lamp.position.set(x,6.7,z);scene.add(lamp);
  }
  // Ceiling vents and round smoke detector.
  for(const [x,z] of [[-1.6,2.1],[5.6,2.1],[-5,-7]]) {
    box(1.1,.035,1.1,x,7.07,z,M.trim);
    for(let i=-2;i<=2;i++) box(.8,.012,.035,x,7.044,z+i*.16,M.seam);
  }
  cylinder(.18,.08,1.2,7.03,4.3,M.trim);
  // Cable trays run along both side walls near the ceiling.
  for(const x of [-7.7,7.7]) {
    box(.3,.12,24,x,5.85,0,M.metal);
    for(let z=-11;z<12;z+=.55) box(.36,.055,.05,x,5.92,z,M.black);
  }
  // Left-side long two-level light-wood computer bench, like the reference.
  box(3.35,.13,18.6,-6.26,1.64,-1.4,M.wood,true);
  box(3.35,.09,18.6,-6.26,3.28,-1.4,M.wood,true);
  box(3.35,.07,18.6,-6.26,1.54,-1.4,M.woodEdge);
  for(let z=-10;z<=7;z+=3.2) {
    box(.09,1.55,.09,-4.8,.77,z,M.metal);
    box(.09,1.55,.09,-7.65,.77,z,M.metal);
    box(.12,1.5,.12,-7.75,2.48,z,M.metal);
  }
  // Right wall matching desks, visible deeper into the room.
  box(2.45,.13,14.5,6.75,1.62,-3.2,M.wood,true);
  box(2.45,.09,14.5,6.75,3.15,-3.2,M.wood,true);
  for(let z=-10;z<=3;z+=3) box(.09,1.6,.09,5.65,.8,z,M.metal);
  // Black desktop computers with subtle real screen content.
  function screenMaterial(index) {
    const c=document.createElement('canvas');c.width=256;c.height=160;
    const g=c.getContext('2d');
    g.fillStyle='#10151e';g.fillRect(0,0,256,160);
    g.fillStyle='#1b2635';g.fillRect(0,0,256,20);
    g.fillStyle='#4c7790';g.fillRect(10,8,52,4);
    if(index%3===0){g.fillStyle='#253d4c';g.fillRect(22,40,210,77);}
    else if(index%3===1){g.fillStyle='#263949';g.fillRect(18,39,95,100);g.fillRect(126,39,110,100);}
    for(let j=0;j<5;j++){g.fillStyle=j%2?'#426075':'#6a8190';g.fillRect(25,47+j*16,55+(index*13+j*19)%80,3);}
    const tex=new THREE.CanvasTexture(c);tex.encoding=THREE.sRGBEncoding;
    return new THREE.MeshBasicMaterial({map:tex,toneMapped:false});
  }
  const displays=Array.from({length:6},(_,i)=>screenMaterial(i));
  function computer(x,z,level,i,face=1) {
    const y=level;
    box(1.14,.72,.1,x,y+.53,z,M.black,true);
    box(1.03,.6,.012,x,y+.53,z+face*.058,displays[i%6]);
    box(.065,.3,.065,x,y+.03,z,M.metal);
    box(.5,.04,.31,x,y-.11,z+.05,M.black);
    box(.9,.035,.27,x,y-.08,z+face*.52,M.black);
    box(.23,.035,.3,x+.65,y-.08,z+face*.5,M.black);
    box(.44,.7,.7,x-.7,y-.36,z-.1,M.black);
  }
  // Slim desktop PC towers on the upper shelves (no upper monitors).
  function upperPcTower(x,z,shelfY) {
    const y=shelfY+.09;
    box(.42,.78,.82,x,y+.39,z,M.black,true);
    box(.425,.74,.035,x,y+.39,z+.427,M.trim);
    box(.29,.055,.012,x,y+.60,z+.45,M.metal);
    const power=new THREE.Mesh(new THREE.SphereGeometry(.025,8,8),new THREE.MeshBasicMaterial({color:0x68b6e2}));
    power.position.set(x+.13,y+.20,z+.452);scene.add(power);
    for(let k=0;k<3;k++) box(.25,.012,.013,x,y+.39-k*.055,z+.452,M.seam);
  }
  for(let z=-9.8;z<=6;z+=3.1) upperPcTower(-6.8,z,3.325);
  for(let z=-9.8;z<=1;z+=3.3) upperPcTower(6.75,z,3.195);
  // Monitors and accessories stay on the lower desks only.
  for(let z=-10;z<=6.2;z+=3.1){
    computer(-6.2,z,1.75,Math.round(z+12),1);
  }
  for(let z=-10;z<=1;z+=3.3){
    computer(6.65,z,1.75,Math.round(z+22),1);
  }
  // Rolling black task chairs with five-spoke bases.
  function chair(x,z,rotation=0) {
    const group=new THREE.Group();scene.add(group);group.position.set(x,0,z);group.rotation.y=rotation;
    function part(w,h,d,px,py,pz,mat){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);o.position.set(px,py,pz);o.castShadow=true;group.add(o);}
    part(.82,.12,.8,0,.94,0,M.chair);
    part(.85,.98,.12,0,1.5,-.36,M.chair);
    part(.07,.75,.07,0,.49,0,M.metal);
    for(let a=0;a<5;a++){
      const theta=a*Math.PI*2/5;
      const spoke=new THREE.Mesh(new THREE.BoxGeometry(.09,.07,.57),M.black);
      spoke.position.set(Math.sin(theta)*.23,.16,Math.cos(theta)*.23);spoke.rotation.y=theta;group.add(spoke);
      part(.14,.11,.16,Math.sin(theta)*.48,.1,Math.cos(theta)*.48,M.black);
    }
  }
  for(let z=-9;z<=5;z+=3.1) chair(-3.7,z,.25);
  for(let z=-9;z<=1;z+=3.2) chair(4.9,z,-.3);
  // Central long white collaboration table is the photo's focal point.
  box(2.85,.14,7.7,.25,1.45,-1.7,M.table,true);
  for(const x of [-.95,1.45]) for(const z of [-5.1,1.65]) {
    box(.08,1.4,.08,x,.72,z,M.metal);
    cylinder(.11,.065,x,.07,z,M.black);
  }
  // Small book / teaching materials on the central table.
  box(.58,.07,.45,.55,1.57,-4.1,material(0x2d6273));
  box(.43,.06,.35,-.25,1.57,-4.3,material(0xb6ab8e));
  // Large black front-of-room display, plus soft purple accent glow.
  box(4.4,2.65,.18,0,4.1,-11.79,M.black,true);
  box(4.12,2.38,.012,0,4.1,-11.675,M.tv);
  box(4.8,.08,.12,0,2.69,-11.74,M.trim);
  const accent=new THREE.PointLight(0x7961d8,1.2,7,2);
  accent.position.set(0,5.5,-11.1);scene.add(accent);
  box(2.8,.08,.1,0,5.64,-11.72,M.purple);
  // RIT lettering centered on the wall sign above the TV.
  box(2.4,.48,.05,0,6.03,-11.78,M.table);
  const signCanvas=document.createElement('canvas');
  signCanvas.width=512;signCanvas.height=128;
  const signCtx=signCanvas.getContext('2d');
  signCtx.clearRect(0,0,512,128);
  signCtx.fillStyle='#e86b16';
  signCtx.font='900 105px Arial, sans-serif';
  signCtx.textAlign='center';signCtx.textBaseline='middle';
  signCtx.fillText('RIT',256,66);
  const signTexture=new THREE.CanvasTexture(signCanvas);
  const signMaterial=new THREE.MeshBasicMaterial({map:signTexture,transparent:true,depthWrite:false,side:THREE.DoubleSide});
  const ritSign=new THREE.Mesh(new THREE.PlaneGeometry(1.75,.43),signMaterial);
  ritSign.position.set(0,6.04,-11.735);
  scene.add(ritSign);
  // Overall dimmer neutral light: clean classroom, not scary.
  scene.add(new THREE.HemisphereLight(0xe8e9ee,0x6e747e,.96));
  const sunlight=new THREE.DirectionalLight(0xe9e6df,.48);
  sunlight.position.set(-4,8,6);sunlight.castShadow=true;
  sunlight.shadow.mapSize.set(1024,1024);
  sunlight.shadow.camera.left=-13;sunlight.shadow.camera.right=13;
  sunlight.shadow.camera.top=15;sunlight.shadow.camera.bottom=-15;
  scene.add(sunlight);
  function resize(){const w=innerWidth,h=innerHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false);}
  addEventListener('resize',resize);resize();
  const start=performance.now();
  function animate(now){
    requestAnimationFrame(animate);
    const t=(now-start)/1000;
    camera.position.set(1.0+Math.sin(t*.12)*.18,2.9,10.6-Math.min(t*.045,.65));
    camera.lookAt(-.25,3.1,-6.4);
    renderer.render(scene,camera);
  }
  requestAnimationFrame(animate);
}
startClassroom();
</script>
</body>
</html>
