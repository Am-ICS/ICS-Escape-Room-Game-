
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>RIT Computer Studies</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #171722;
  font-family: Arial, sans-serif;
}

.screen {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* FIXED: SMALLER, CENTERED GIF */
.scene-image {
  display: block;
  width: 90%;
  height: 85%;
  object-fit: contain;
  object-position: center;
}

/* SMALLER BUTTON MENU */
.menu {
  position: absolute;
  top: 48%;
  right: 8%;
  width: 28%;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.menu button {
  padding: 12px 10px;
  background: #202d38;
  color: white;
  border: 2px solid #60748b;
  border-radius: 12px;
  font-size: clamp(11px, 1.3vw, 17px);
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

.menu button:hover {
  border-color: #72ff65;
  box-shadow: 0 0 15px #72ff65;
}

/* INVISIBLE NEXT BUTTON */
.next {
  position: absolute;
  bottom: 5%;
  right: 5%;
  width: 19%;
  height: 12%;
  border: none;
  background: transparent;
  cursor: pointer;
}

/* MOBILE */
@media (max-width: 650px) {
  .scene-image {
    width: 100%;
    height: 75%;
  }

  .menu {
    top: auto;
    bottom: 7%;
    left: 50%;
    right: auto;
    transform: translateX(-50%);
    width: 85%;
    gap: 8px;
  }

  .menu button {
    padding: 10px;
    font-size: 13px;
  }
}
</style>
</head>

<body>

<div class="screen">

  <!-- ORIGINAL ANIMATED GIF -->
  <img
    class="scene-image"
    src="BaldGuyBlink.gif"
    alt="ICS Welcome"
  >

  <div class="menu">

    <button onclick="choose('lab')">
      💻 Computer lab access
    </button>

    <button onclick="choose('course')">
      📖 Course information
    </button>

    <button class="security"
            onclick="choose('security')">
      🛡️ Security system demo
    </button>

  </div>

  <button
    class="next"
    aria-label="Next"
    onclick="location.href='screen3.html'">
  </button>

</div>

<script>
function choose(option) {

  if (option === "lab") {
    window.location.href = "lab.html";
  }

  if (option === "course") {
    window.location.href = "course.html";
  }

  if (option === "security") {
    window.location.href = "hallway.html";
  }

}
</script>

</body>
</html>
