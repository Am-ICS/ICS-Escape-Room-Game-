
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RIT Computer Studies | Welcome</title>


<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap');

:root {
  --bg: #10131b;
  --panel: rgba(20, 24, 35, .88);
  --orange: #f76902;
  --orange-light: #ff9749;
  --white: #f7f9fc;
  --muted: #b5bdc9;
}

* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  background: var(--bg);
  color: var(--white);
  font-family: 'DM Sans', Arial, sans-serif;
}

button {
  font: inherit;
}

/* MAIN SCENE */

.screen {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  isolation: isolate;
}

/* ORIGINAL ANIMATED BACKGROUND */

.scene-image {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  animation: sceneReveal 1.4s ease-out both;
}

@keyframes sceneReveal {
  from {
    opacity: 0;
    transform: scale(1.04);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* ORANGE AMBIENT GLOW */

.ambient-glow {
  position: absolute;
  width: 500px;
  height: 500px;
  right: 10%;
  top: 25%;
  background: radial-gradient(
    circle,
    rgba(247, 105, 2, .16),
    transparent 70%
  );
  pointer-events: none;
  z-index: 1;
  animation: glowPulse 5s ease-in-out infinite;
}

@keyframes glowPulse {
  0%, 100% {
    opacity: .5;
    transform: scale(1);
  }

  50% {
    opacity: 1;
    transform: scale(1.15);
  }
}

/* LOGIN PANEL - MOVED LEFT TOWARD HAND */

.menu {
  position: absolute;
  top: 48%;
  right: 18%;
  width: min(340px, 30%);
  z-index: 5;
  animation: menuReveal 1s .35s both;
}

@keyframes menuReveal {
  from {
    opacity: 0;
    transform: translateY(25px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* GLASS PANEL */

.menu-panel {
  position: relative;
  padding: 27px;
  border-radius: 22px;
  background: var(--panel);
  border: 1px solid rgba(255,255,255,.14);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow:
    0 20px 55px rgba(0,0,0,.35),
    inset 0 1px rgba(255,255,255,.08);
  overflow: hidden;
}

/* TOP ORANGE GLOW LINE */

.menu-panel::before {
  content: "";
  position: absolute;
  top: 0;
  left: 20%;
  width: 60%;
  height: 2px;
  background: linear-gradient(
    90deg,
    transparent,
    var(--orange),
    transparent
  );
  box-shadow: 0 0 16px var(--orange);
}

/* LABEL */

.menu-label {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--orange-light);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 13px;
}

.menu-label::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--orange);
  box-shadow: 0 0 12px var(--orange);
}

/* TEXT */

.menu-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: clamp(20px, 2.2vw, 30px);
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -.7px;
  margin: 0 0 9px;
}

.menu-description {
  color: var(--muted);
  font-size: clamp(11px, 1vw, 13px);
  line-height: 1.65;
  margin: 0 0 22px;
}

/* ORANGE LOGIN BUTTON */

.login-button {
  position: relative;
  width: 100%;
  min-height: 53px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 13px 18px;
  background: linear-gradient(
    135deg,
    #ff9749,
    #f76902
  );
  color: white;
  border: 1px solid #ffae73;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  overflow: hidden;
  transition:
    transform .25s ease,
    box-shadow .25s ease,
    filter .25s ease;
  box-shadow: 0 5px 22px rgba(247,105,2,.25);
}

/* SHINE ANIMATION */

.login-button::before {
  content: "";
  position: absolute;
  width: 45%;
  height: 200%;
  left: -80%;
  top: -50%;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.55),
    transparent
  );
  transform: rotate(25deg);
  transition: left .6s ease;
}

.login-button:hover::before {
  left: 140%;
}

.login-button:hover {
  transform: translateY(-3px);
  filter: brightness(1.08);
  box-shadow:
    0 10px 30px rgba(247,105,2,.4),
    0 0 20px rgba(247,105,2,.2);
}

.login-button:active {
  transform: scale(.98);
}

.login-button:focus-visible {
  outline: 3px solid white;
  outline-offset: 4px;
}

/* ARROW */

.button-arrow {
  font-size: 21px;
  transition: transform .25s;
}

.login-button:hover .button-arrow {
  transform: translateX(5px);
}

/* FOOTER */

.menu-footer {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 7px;
  margin-top: 17px;
  color: #8793a1;
  font-size: 10px;
}

.menu-footer-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--orange);
}

/* INVISIBLE NEXT BUTTON */

.next {
  position: absolute;
  bottom: 5%;
  right: 5%;
  width: 19%;
  height: 12%;
  border: 0;
  background: transparent;
  cursor: pointer;
  z-index: 2;
}

.next:focus-visible {
  outline: 2px solid var(--orange);
  outline-offset: 3px;
}

/* SCREEN TRANSITION */

#transition {
  position: fixed;
  inset: 0;
  background: #05070c;
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity .85s ease;
}

#transition.show {
  opacity: 1;
  pointer-events: all;
}

/* TABLET */

@media (min-width: 651px) and (max-width: 800px) {
  .menu {
    right: 12%;
    top: 45%;
    width: 38%;
  }

  .menu-panel {
    padding: 20px;
    border-radius: 17px;
  }
}

/* MOBILE */

@media (max-width: 650px) {
  .scene-image {
    width: 100%;
    height: 85%;
  }

  .menu {
    top: auto;
    bottom: 5%;
    left: 50%;
    right: auto;
    width: min(390px, 88%);
    transform: translateX(-50%);
    animation: mobileMenuReveal 1s .3s both;
  }

  @keyframes mobileMenuReveal {
    from {
      opacity: 0;
      transform: translate(-50%, 20px);
    }

    to {
      opacity: 1;
      transform: translate(-50%, 0);
    }
  }

  .menu-panel {
    padding: 19px 22px;
  }

  .menu-title {
    font-size: 22px;
  }

  .menu-description {
    font-size: 12px;
    margin-bottom: 15px;
  }

  .login-button {
    min-height: 47px;
  }

  .ambient-glow {
    right: -250px;
  }

  .next {
    bottom: 0;
    right: 0;
    width: 15%;
    height: 5%;
  }
}

/* SHORT SCREENS */

@media (max-height: 550px) and (min-width: 651px) {
  .menu {
    top: 25%;
  }

  .menu-panel {
    padding: 17px;
  }

  .menu-description {
    margin-bottom: 12px;
  }
}

/* ACCESSIBILITY */

@media (prefers-reduced-motion: reduce) {
  .scene-image,
  .menu,
  .ambient-glow {
    animation: none;
  }

  .login-button,
  #transition {
    transition-duration: .15s;
  }
}
</style>
</head>

<body>

<div class="screen">

  <!-- ORIGINAL ANIMATED BACKGROUND -->

  <img
    class="scene-image"
    src="BaldGuyBlink.gif"
    alt="RIT ICS welcome scene with animated teacher"
  >

  <!-- AMBIENT LIGHTING -->

  <div class="ambient-glow" aria-hidden="true"></div>

  <!-- LOGIN PANEL -->

  <div class="menu">

    <div class="menu-panel">

      <div class="menu-label">
        Interactive Classroom
      </div>

      <h1 class="menu-title">
        Ready to begin?
      </h1>

      <p class="menu-description">
        Step into the classroom and continue
        your interactive learning experience.
      </p>

      <button
        class="login-button"
        type="button"
        onclick="choose('course')"
      >
        <span>Log In</span>
        <span class="button-arrow" aria-hidden="true">→</span>
      </button>

      <div class="menu-footer">
        <span class="menu-footer-dot"></span>
        RIT Computer Studies Experience
      </div>

    </div>

  </div>

  <!-- INVISIBLE NEXT BUTTON -->

  <button
    class="next"
    type="button"
    aria-label="Next screen"
    onclick="navigateSmoothly('screen3.html')"
  ></button>

</div>

<!-- TRANSITION OVERLAY -->

<div
  id="transition"
  aria-hidden="true"
></div>

<script src="disablekeyboard.js"></script>

<script>
let transitioning = false;

function navigateSmoothly(destination) {
  if (transitioning) return;

  transitioning = true;

  const overlay = document.getElementById("transition");

  overlay.classList.add("show");

  // Wait for the fade animation to finish.
  setTimeout(() => {
    window.location.href = destination;
  }, 850);
}

function choose(option) {
  const pages = {
    course: "course.html"
  };

  if (pages[option]) {
    navigateSmoothly(pages[option]);
  }
}
</script>

</body>
</html>
