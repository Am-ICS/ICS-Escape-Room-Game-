
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>RIT Computer Studies</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #171722;
  font-family: Arial, sans-serif;
}

.screen {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.scene-image {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.menu {
  position: absolute;
  top: 45%;
  right: 5%;
  width: 36%;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.menu button {
  padding: 15px 10px;
  background: #202d38;
  color: white;
  border: 3px solid #60748b;
  border-radius: 14px;
  font-size: clamp(12px, 1.6vw, 20px);
  font-weight: bold;
  cursor: pointer;
}

.menu button:hover {
  background: #304454;
  border-color: white;
}

.menu .security {
  background: #24472b;
  border-color: #72ff65;
  box-shadow: 0 0 15px #72ff65;
}

.next {
  position: absolute;
  bottom: 5%;
  right: 5%;
  width: 19%;
  height: 12%;
  border: none;
  background: transparent;
  cursor: pointer;
}

</style>
</head>

<body>

<div class="screen">

  <img src="learn.png"
       class="scene-image"
       alt="RIT Computer Studies">

  <div class="menu">

    <button onclick="choose('lab')">
      💻 Computer lab access
    </button>

    <button onclick="choose('course')">
      📖 Course information
    </button>

    <button class="security"
            onclick="choose('security')">
      🛡️ Security system demo
    </button>

  </div>

  <button class="next"
          aria-label="Next"
          onclick="location.href='screen3.html'">
  </button>

</div>

<script>
function choose(option) {

  if (option === "lab") {
    alert("Computer lab access is locked!");
  }

  if (option === "course") {
    alert("Course information is unavailable!");
  }

  if (option === "security") {
    window.location.href = "screen3.html";
  }

}
</script>

</body>
</html>
