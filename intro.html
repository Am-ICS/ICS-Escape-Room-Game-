
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ICS Escape Room - RIT Hallway</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #89939e;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
}

/* TOP TITLE */

#topBar {
  position: fixed;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;

  background: rgba(28, 35, 44, 0.9);
  color: white;

  padding: 13px 25px;
  border-radius: 12px;

  font-size: 17px;
  font-weight: bold;
  white-space: nowrap;

  box-shadow: 0 5px 25px #0005;
}

/* WALKING MESSAGE */

#message {
  position: fixed;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;

  background: rgba(28, 35, 44, 0.9);
  color: white;

  padding: 14px 24px;
  border-radius: 12px;

  text-align: center;
  max-width: 92%;

  box-shadow: 0 5px 25px #0005;
}

/* TRANSITION */

#fade {
  position: fixed;
  inset: 0;
  z-index: 8;

  background: #111820;
  opacity: 0;
  pointer-events: none;

  transition: opacity 1.1s ease;
}

#fade.active {
  opacity: 1;
}

/* MOBILE */

@media (max-width: 650px) {
  #topBar { font-size: 13px; padding: 11px 16px; }
}

/* SKIP BUTTON - BOTTOM RIGHT */
#skipButton {
  position: fixed;
  right: 22px;
  bottom: 22px;
  z-index: 12;
  padding: 12px 20px;
  border: 2px solid #f76902;
  border-radius: 10px;
  background: rgba(28,35,44,.94);
  color: white;
  font: bold 15px Arial, sans-serif;
  cursor: pointer;
  box-shadow: 0 5px 20px #0007;
}
#skipButton:hover { background: #f76902; }

/* WARM, MODERN CAMPUS — NOT HORROR */
body{background:#e5edf3}
#topBar{top:22px;background:rgba(255,255,255,.92);color:#233244;border:1px solid #dce5eb;border-left:5px solid #f76902;border-radius:14px;padding:14px 25px;box-shadow:0 12px 36px #26384926;letter-spacing:.7px;backdrop-filter:blur(12px)}
#message{bottom:26px;background:rgba(255,255,255,.94);color:#304355;border:1px solid #d7e3ec;border-radius:14px;box-shadow:0 12px 36px #24374b26;font-size:15px;font-weight:700;letter-spacing:.3px;backdrop-filter:blur(12px)}
#skipButton{background:#f76902;border:1px solid #ff9b50;border-radius:12px;box-shadow:0 9px 24px #f7690244;transition:transform .2s,background .2s}
#skipButton:hover{background:#db5600;transform:translateY(-2px)}
#skipButton:focus-visible{outline:3px solid #264d78;outline-offset:3px}
#fade{background:#e7eff6}
@media(max-width:650px){#topBar{max-width:94vw;white-space:normal;text-align:center}#message{bottom:82px}#skipButton{bottom:14px;right:14px}}
</style>
</head>

<body>

<!-- HALLWAY UI -->

<div id="topBar">
  🐯 RIT | ICS ESCAPE ROOM
</div>

<div id="message">
  ☀️ Welcome to RIT — walking to the ICS Lab
</div>

<div id="fade"></div>
<button id="skipButton" onclick="window.location.href='screen2.html'">SKIP INTRO ⏭</button>

<!-- THREE.JS -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* CHECK THREE.JS */

if (typeof THREE === "undefined") {

  document.getElementById("message").textContent =
    "Could not load 3D. Check your internet connection.";

} else {

  /* CREATE 3D SCENE */

  const scene = new THREE.Scene();

  scene.background = new THREE.Color(0xdceaf3);

  scene.fog = new THREE.Fog(
    0xdceaf3,
    18,
    55
  );

  const camera = new THREE.PerspectiveCamera(
    72,
    window.innerWidth / window.innerHeight,
    0.1,
    100
  );

  const renderer = new THREE.WebGLRenderer({
    antialias: true
  });

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
  );

  document.body.appendChild(renderer.domElement);

  /* SOFT LIGHTING */

  scene.add(new THREE.HemisphereLight(
    0xffffff,
    0x667080,
    0.57
  ));

  const sunlight = new THREE.DirectionalLight(
    0xfff6e8,
    0.52
  );

  sunlight.position.set(3, 8, 4);
  scene.add(sunlight);

  /* MATERIALS */

  const wallMat = new THREE.MeshStandardMaterial({
    color: 0xe7ebef
  });

  const floorMat = new THREE.MeshStandardMaterial({
    color: 0xaebbc7,
    roughness: 0.8
  });

  const ceilingMat = new THREE.MeshStandardMaterial({
    color: 0xf4f7fa
  });

  const trimMat = new THREE.MeshStandardMaterial({
    color: 0x8799a7
  });

  const doorMat = new THREE.MeshStandardMaterial({
    color: 0x9c6b4b
  });

  const glassMat = new THREE.MeshStandardMaterial({
    color: 0x789db7,
    transparent: true,
    opacity: 0.6
  });

  const orangeMat = new THREE.MeshStandardMaterial({
    color: 0xf76902
  });

  /* BOX HELPER */

  function box(w, h, d, material, x, y, z) {

    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, d),
      material
    );

    mesh.position.set(x, y, z);

    scene.add(mesh);

    return mesh;
  }

  /* HALLWAY FLOOR */

  box(
    7, 0.2, 50,
    floorMat,
    0, -0.1, -18
  );

  /* CEILING */

  box(
    7, 0.2, 50,
    ceilingMat,
    0, 5, -18
  );

  /* LEFT AND RIGHT WALLS */

  box(
    0.2, 5, 50,
    wallMat,
    -3.5, 2.5, -18
  );

  /* Right wall has open glass bays rather than a solid wall */
  box(0.2, 1.0, 50, wallMat, 3.5, 0.5, -18);
  box(0.2, 0.7, 50, wallMat, 3.5, 4.65, -18);
  for (let z = -17; z >= -39; z -= 5.5) {
    box(0.22, 3.3, 0.18, trimMat, 3.5, 2.65, z);
  }
  const windowGlass = new THREE.MeshPhysicalMaterial({
    color: 0xc7e9ff, transparent: true, opacity: 0.18,
    roughness: 0.04, metalness: 0.08, side: THREE.DoubleSide,
    depthWrite: false
  });
  box(0.045, 3.3, 25, windowGlass, 3.48, 2.65, -28);
  box(0.12, 0.10, 25, trimMat, 3.44, 2.35, -28);
  box(0.12, 0.10, 25, trimMat, 3.44, 3.8, -28);

  /* View outside the windows: lawn, paths, trees, campus buildings */
  const grassMat = new THREE.MeshStandardMaterial({color:0x568b55, roughness:1});
  const pathMat = new THREE.MeshStandardMaterial({color:0xb2a99a, roughness:1});
  const trunkMat = new THREE.MeshStandardMaterial({color:0x70513d});
  const leafMat = new THREE.MeshStandardMaterial({color:0x397b49, roughness:1});
  const brickMat = new THREE.MeshStandardMaterial({color:0x9d503b, roughness:0.9});
  const skyMat = new THREE.MeshBasicMaterial({color:0xaad7f1, side:THREE.DoubleSide});
  box(0.1, 18, 55, skyMat, 25, 6, -27);
  box(35, 0.15, 55, grassMat, 19, -0.15, -27);
  box(3, 0.035, 55, pathMat, 9, -0.04, -27);
  for (const z of [-19,-26,-33,-39]) {
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.23,3,8), trunkMat);
    trunk.position.set(13,1.5,z); scene.add(trunk);
    const canopy = new THREE.Mesh(new THREE.SphereGeometry(1.7,10,8), leafMat);
    canopy.position.set(13,4.1,z); scene.add(canopy);
  }
  box(2, 8, 20, brickMat, 23, 4, -30);
  const outdoorWindowMat = new THREE.MeshStandardMaterial({color:0x5b8295,metalness:0.35,roughness:0.2});
  for (let z=-21;z>=-38;z-=3.4) {
    for (const y of [2,4.5,7]) box(0.07,1.2,1.8,outdoorWindowMat,21.95,y,z);
  }
  const sunshine = new THREE.DirectionalLight(0xffe5bd, 0.67);
  sunshine.position.set(14,9,-20); scene.add(sunshine);

  /* WALL TRIM */

  box(
    0.08, 0.18, 50,
    trimMat,
    -3.35, 0.1, -18
  );

  box(
    0.08, 0.18, 50,
    trimMat,
    3.35, 0.1, -18
  );

  /* Extra RIT hallway details */
  const stripeMat = new THREE.MeshStandardMaterial({color:0xf76902});
  box(0.05,0.12,25,stripeMat,-3.35,1.05,-28);
  box(0.05,0.12,25,stripeMat,3.33,1.05,-28);
  for (let z=-20; z>=-37; z-=5) {
    box(0.07,0.18,0.35,orangeMat,-3.32,1.55,z);
  }

  /* FLOOR TILE LINES */

  for (let z = 4; z > -39; z -= 4) {

    box(
      6.7, 0.01, 0.045,
      trimMat,
      0, 0.01, z
    );

  }

  /* CEILING LIGHTS */

  for (let z = 2; z > -38; z -= 6) {

    const panelMat = new THREE.MeshBasicMaterial({
      color: 0xdce3e8
    });

    box(
      1.6, 0.04, 2.3,
      panelMat,
      0, 4.88, z
    );

    const light = new THREE.PointLight(
      0xffffff,
      0.13,
      10
    );

    light.position.set(
      0, 4.65, z
    );

    scene.add(light);
  }

  /* CLASSROOM SIDE DOORS */

  for (let z = -2; z > -30; z -= 8) {

    for (const side of [-1, 1]) {

      box(
        0.07, 3, 1.6,
        doorMat,
        side * 3.38, 1.5, z
      );

      box(
        0.09, 3.2, 0.08,
        trimMat,
        side * 3.31, 1.6, z - 0.86
      );

      box(
        0.09, 3.2, 0.08,
        trimMat,
        side * 3.31, 1.6, z + 0.86
      );

      box(
        0.09, 0.08, 1.8,
        trimMat,
        side * 3.31, 3.2, z
      );

      box(
        0.09, 0.12, 0.12,
        orangeMat,
        side * 3.26, 1.5, z + 0.48
      );

      box(
        0.09, 0.8, 0.7,
        glassMat,
        side * 3.32, 2.25, z
      );

    }

  }

  /* HALLWAY END WALL */

  box(
    7, 5, 0.2,
    wallMat,
    0, 2.5, -42
  );

  /* FINAL ICS DOOR */

  const doorPivot = new THREE.Group();

  doorPivot.position.set(
    -1.15, 0, -41.75
  );

  scene.add(doorPivot);

  const finalDoor = new THREE.Mesh(
    new THREE.BoxGeometry(
      2.3, 3.6, 0.12
    ),
    doorMat
  );

  finalDoor.position.set(
    1.15, 1.8, 0
  );

  doorPivot.add(finalDoor);

  /* DOOR HANDLE */

  const handle = new THREE.Mesh(
    new THREE.BoxGeometry(
      0.12, 0.12, 0.15
    ),
    trimMat
  );

  handle.position.set(
    2.05, 1.7, 0.13
  );

  doorPivot.add(handle);

  /* DOOR FRAME */

  box(
    0.15, 3.8, 0.3,
    trimMat,
    -1.25, 1.9, -41.6
  );

  box(
    0.15, 3.8, 0.3,
    trimMat,
    1.25, 1.9, -41.6
  );

  box(
    2.65, 0.15, 0.3,
    trimMat,
    0, 3.85, -41.6
  );

  /* ICS ROOM SIGN */

  const signCanvas = document.createElement("canvas");

  signCanvas.width = 1024;
  signCanvas.height = 256;

  const signCtx = signCanvas.getContext("2d");

  signCtx.fillStyle = "#ffffff";

  signCtx.fillRect(
    0, 0, 1024, 256
  );

  signCtx.fillStyle = "#f76902";

  signCtx.font = "bold 100px Arial";

  signCtx.textAlign = "center";
  signCtx.textBaseline = "middle";

  signCtx.fillText(
    "ICS ROOM",
    512,
    128
  );

  const signTexture = new THREE.CanvasTexture(
    signCanvas
  );

  const signMat = new THREE.MeshBasicMaterial({
    map: signTexture
  });

  box(
    3.2, 0.8, 0.05,
    signMat,
    0, 4.4, -41.5
  );


  /* CAMPUS DESIGN UPGRADE: warm daylight, real-looking architectural details. */
  const softWhite = new THREE.MeshStandardMaterial({color:0xf7fafc,roughness:.83});
  const warmWood = new THREE.MeshStandardMaterial({color:0xb88763,roughness:.78});
  const darkMetal = new THREE.MeshStandardMaterial({color:0x536574,metalness:.58,roughness:.38});
  const accentOrange = new THREE.MeshStandardMaterial({color:0xf76902,roughness:.5});
  const plantGreen = new THREE.MeshStandardMaterial({color:0x41835a,roughness:.92});
  const plantPot = new THREE.MeshStandardMaterial({color:0xf0e7df,roughness:.86});
  const blueSeat = new THREE.MeshStandardMaterial({color:0x496d84,roughness:.9});
  // Ceiling grid, recessed fixtures and floor-tile detail.
  for(let z=3;z>=-40;z-=2.5){
    box(6.7,.018,.022,trimMat,0,4.89,z);
    for(const x of [-2.25,0,2.25])box(.022,.018,2.4,trimMat,x,4.89,z-1.2);
  }
  for(let z=3;z>=-40;z-=2){
    for(const x of [-2.3,0,2.3])box(.018,.012,1.92,trimMat,x,.014,z-.98);
  }
  // Low wall panels, warm wooden trim and a subtle RIT orange feature band.
  for(const side of [-1,1]){
    box(.035,.95,42,warmWood,side*3.32,.57,-19);
    box(.055,.055,42,accentOrange,side*3.28,1.14,-19);
    box(.08,.12,42,darkMetal,side*3.28,.09,-19);
  }
  // Decorative benches near the lab entrance.
  for(const z of [-33.2,-37]){
    box(.85,.13,1.6,warmWood,-2.62,.64,z);
    box(.16,.6,1.5,blueSeat,-3.05,1.03,z);
    for(const zz of [-.55,.55])for(const xx of [-2.95,-2.25])
      box(.09,.55,.09,darkMetal,xx,.32,z+zz);
  }
  // Potted plants placed by the corridor entrance and outside the ICS room.
  for(const z of [-23.4,-35.8]){
    const x=-2.55;
    box(.66,.62,.66,plantPot,x,.34,z);
    const stem=new THREE.Mesh(new THREE.CylinderGeometry(.055,.085,.9,8),darkMetal);
    stem.position.set(x,1.03,z);scene.add(stem);
    for(let i=0;i<5;i++){
      const leaf=new THREE.Mesh(new THREE.SphereGeometry(.37,10,8),plantGreen);
      leaf.scale.set(.62,1.25,.48);
      leaf.position.set(x+Math.sin(i*2.51)*.3,1.37+(i%2)*.22,z+Math.cos(i*2.51)*.3);
      scene.add(leaf);
    }
  }
  // Modern room signs rendered as readable canvas textures.
  function campusSign(label,x,y,z,side){
    const c=document.createElement('canvas');c.width=768;c.height=240;
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,768,240);
    g.fillStyle='#f76902';g.fillRect(0,0,20,240);
    g.fillStyle='#24364a';g.font='bold 61px Arial';g.textAlign='center';g.textBaseline='middle';g.fillText(label,392,120);
    const texture=new THREE.CanvasTexture(c);
    const sign=new THREE.Mesh(new THREE.PlaneGeometry(1.7,.53),new THREE.MeshBasicMaterial({map:texture,side:THREE.DoubleSide}));
    sign.position.set(x,y,z);sign.rotation.y=side*Math.PI/2;scene.add(sign);
  }
  campusSign('CLASSROOM',-3.26,3.68,-27,1);
  campusSign('STUDY AREA',3.26,3.68,-31,-1);
  campusSign('ICS LAB',-3.26,3.68,-36,1);
  // More natural indirect fill light along the hall.
  for(const z of [-26,-34,-40]){
    const fill=new THREE.PointLight(0xfff6e5,.25,11,2);
    fill.position.set(0,4.25,z);scene.add(fill);
  }

  /* AUTOMATIC WALK */

  const clock = new THREE.Clock();

  // Slow, short cinematic walk with ONE gentle look toward the windows.
  const WALK_TIME = 7.5;

  function smoothstep(a, b, x) {
    const v = THREE.MathUtils.clamp((x - a) / (b - a), 0, 1);
    return v * v * (3 - 2 * v);
  }

  function automaticLook(t) {
    // Turn once toward the windows, linger, then smoothly face forward.
    // No second glance or side-to-side sweep.
    const glance = smoothstep(1.0, 3.1, t) *
                   (1 - smoothstep(4.6, 6.9, t));
    camera.rotation.set(-0.035 * glance, -0.34 * glance, 0, 'YXZ');
  }

  const DOOR_TIME = 1.5;
  const TOTAL_TIME = 10.5;

  let finished = false;
  let doorStarted = false;

  camera.position.set(
    0, 1.7, -21
  );

  camera.lookAt(
    0, 1.7, -40
  );

  function animate() {

    requestAnimationFrame(animate);

    const t = clock.getElapsedTime();

    /* WALK FORWARD */

    if (t < WALK_TIME) {

      const progress = t / WALK_TIME;

      camera.position.z =
        -21 + (-40 + 21) * progress;

      camera.position.y =
        1.7 + Math.sin(t * 7) * 0.015;

      automaticLook(t);

    }

    /* OPEN THE DOOR */

    else if (t < WALK_TIME + DOOR_TIME) {

      if (!doorStarted) {

        doorStarted = true;

        document.getElementById("message")
          .textContent =
          "🚪 Opening the ICS room...";

      }

      camera.rotation.set(0, 0, 0, 'YXZ');
      const progress =
        (t - WALK_TIME) / DOOR_TIME;

      doorPivot.rotation.y =
        -Math.PI * 0.55 * Math.min(1, progress);

    }

    /* ENTER ROOM */

    else if (t < TOTAL_TIME) {

      document.getElementById("message")
        .textContent =
        "👋 Someone is waiting inside!";

      const progress =
        (t - WALK_TIME - DOOR_TIME) /
        (TOTAL_TIME - WALK_TIME - DOOR_TIME);

      camera.position.z =
        -40 - progress * 1.3;

      camera.lookAt(
        0, 1.7, -45
      );

      if (t > TOTAL_TIME - 1.1) {

        document.getElementById("fade")
          .classList.add("active");

      }

    }

    /* CONTINUE TO THE ALREADY-DESIGNED SCREEN2 */

    else if (!finished) {
      finished = true;
      window.location.href = "screen2.html";
    }

    if (!finished) {
      renderer.render(scene, camera);
    }

  }

  animate();

  /* RESIZE */

  window.addEventListener("resize", () => {

    camera.aspect =
      window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  });

}
</script>

</body>
</html>
