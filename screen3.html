
<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HACKED - System Locked</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
   background: #000 !important;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  overflow-x: hidden;
  padding: 20px;
}

/* ===== RED MATRIX BACKGROUND ===== */

/* Animated falling code */
#matrix {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

/* Dark overlay for readability */
.matrix-overlay {
  position: fixed;
  inset: 0;
  background: radial-gradient(
    circle,
    rgba(0, 0, 0, 0.2) 0%,
    rgba(0, 0, 0, 0.8) 100%
  );
  z-index: 1;
  pointer-events: none;
}

/* Keep game content above Matrix */
body > *:not(#matrix):not(.matrix-overlay) {
  position: relative;
  z-index: 2;
}

/* Keep popups and victory screens on top */
#winScreen,
#timeoutScreen {
  position: fixed !important;
  z-index: 200 !important;
}


.container {
  width: 90%;
  max-width: 800px;
  padding: 30px;
  border: 2px solid red;
  border-radius: 15px;
  background: #140505;
  box-shadow: 0 0 40px #a00000;
  animation: appear 1s ease;
}

.warning {
  color: #ff4444;
  font-size: 16px;
  letter-spacing: 3px;
}

h1 {
  font-size: clamp(35px, 7vw, 70px);
  color: #ff2020;
  text-shadow: 0 0 20px red;
  animation: glitch 0.3s 3;
}

.subtitle {
  font-size: 20px;
  color: #ffaaaa;
}

.locked {
  border: 3px solid red;
  border-radius: 12px;
  padding: 25px;
  margin: 30px 0;
  box-shadow: 0 0 20px #990000;
}

.locked h2 {
  font-size: clamp(24px, 5vw, 40px);
}

.icons {
  display: flex;
  justify-content: space-around;
  gap: 10px;
  margin: 30px 0;
}

.item {
  flex: 1;
  color: #ff5555;
  font-size: 17px;
}

.item span {
  font-size: 35px;
}

.message {
  background: #270909;
  padding: 20px;
  border-radius: 10px;
  color: #ffbbbb;
  line-height: 1.6;
}

button {
  margin-top: 25px;
  padding: 18px 30px;
  background: #cc0000;
  color: white;
  border: 2px solid #ff5555;
  border-radius: 10px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: red;
  box-shadow: 0 0 20px red;
}

/* SHOCKED TEACHER - BOTTOM LEFT */

.teacher-area {
  position: fixed;
  bottom: 10px;
  left: 10px;
  width: 190px;
  z-index: 5;
  pointer-events: none;
  animation: teacherAppear 0.8s ease-out;
}

.teacher-image {
  display: block;
  width: 300px;

  height: auto;
  filter: drop-shadow(0 5px 15px #000);
}

/* SPEECH BUBBLE */

.speech-bubble span {
  color: #e00000;
}

.speech-bubble::after {
  content: "";
  position: absolute;
  bottom: -13px;
  left: 30px;
  width: 20px;
  height: 20px;
  background: white;
  border-right: 3px solid #111;
  border-bottom: 3px solid #111;
  transform: rotate(45deg);
}

/* ANIMATIONS */

@keyframes glitch {
  0% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  50% { transform: translateX(5px); }
  100% { transform: translateX(0); }
}

@keyframes appear {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes teacherAppear {
  from {
    opacity: 0;
    transform: translateX(-40px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

/* MOBILE */

@media (max-width: 600px) {
  body {
    padding: 15px;
    padding-bottom: 190px;
  }

  .container {
    width: 100%;
    padding: 15px;
  }

  .item {
    font-size: 13px;
  }

  .item span {
    font-size: 26px;
  }

  .teacher-area {
    width: 110px;
    left: 5px;
    bottom: 5px;
  }

  .speech-bubble {
    width: 145px;
    left: 30px;
    padding: 9px;
    font-size: 13px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .container,
  h1,
  .teacher-area {
    animation: none;
  }
}
</style>

<!-- RED MATRIX BACKGROUND -->
<canvas id="matrix"></canvas>
<div class="matrix-overlay"></div>


<script>

/* ===== ANIMATED RED MATRIX RAIN ===== */

(function () {
  const canvas = document.getElementById("matrix");
  const ctx = canvas.getContext("2d");

  const characters =
    "01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&@";

  const fontSize = 18;
  let columns;
  let drops;

  function resizeMatrix() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    columns = Math.ceil(canvas.width / fontSize);

    drops = Array.from(
      { length: columns },
      () => Math.random() * -50
    );
  }

  function drawMatrix() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.06)";
    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    ctx.fillStyle = "#ff2020";
    ctx.font = fontSize + "px monospace";

    for (let i = 0; i < drops.length; i++) {
      const character =
        characters[
          Math.floor(
            Math.random() * characters.length
          )
        ];

      ctx.fillText(
        character,
        i * fontSize,
        drops[i] * fontSize
      );

      if (
        drops[i] * fontSize > canvas.height &&
        Math.random() > 0.975
      ) {
        drops[i] = 0;
      }

      drops[i]++;
    }
  }

  resizeMatrix();

  window.addEventListener(
    "resize",
    resizeMatrix
  );

  setInterval(drawMatrix, 45);
})();

function startEscape() {
  window.location.href = "screen4.html";
}

</script>
