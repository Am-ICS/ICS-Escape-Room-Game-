
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>HACKED - System Locked</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #090909;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  overflow-x: hidden;
}

.container {
  width: 90%;
  max-width: 800px;
  padding: 30px;
  border: 2px solid red;
  border-radius: 15px;
  background: #140505;
  box-shadow: 0 0 40px #a00000;
  animation: appear 1s ease;
}

.warning {
  color: #ff4444;
  font-size: 16px;
  letter-spacing: 3px;
}

h1 {
  font-size: clamp(35px, 7vw, 70px);
  color: #ff2020;
  text-shadow: 0 0 20px red;
  animation: glitch 0.3s 3;
}

.subtitle {
  font-size: 20px;
  color: #ffaaaa;
}

.locked {
  border: 3px solid red;
  border-radius: 12px;
  padding: 25px;
  margin: 30px 0;
  box-shadow: 0 0 20px #990000;
}

.locked h2 {
  font-size: clamp(24px, 5vw, 40px);
}

.icons {
  display: flex;
  justify-content: space-around;
  gap: 10px;
  margin: 30px 0;
}

.item {
  flex: 1;
  color: #ff5555;
  font-size: 17px;
}

.item span {
  font-size: 35px;
}

.message {
  background: #270909;
  padding: 20px;
  border-radius: 10px;
  color: #ffbbbb;
  line-height: 1.6;
}

button {
  margin-top: 25px;
  padding: 18px 30px;
  background: #cc0000;
  color: white;
  border: 2px solid #ff5555;
  border-radius: 10px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: red;
  box-shadow: 0 0 20px red;
}

@keyframes glitch {
  0% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  50% { transform: translateX(5px); }
  100% { transform: translateX(0); }
}

@keyframes appear {
  from { opacity: 0; }
  to { opacity: 1; }
}

@media (max-width: 500px) {
  .container { padding: 15px; }
  .item { font-size: 13px; }
  .item span { font-size: 26px; }
}
</style>
</head>

<body>

<div class="container">

  <p class="warning">
    ⚠ SECURITY BREACH DETECTED ⚠
  </p>

  <h1>SYSTEM HACKED!</h1>

  <p class="subtitle">
    Your computer has been HACKED.
  </p>

  <div class="locked">
    <h2>🔒 EVERYTHING IS LOCKED!</h2>
  </div>

  <div class="icons">

    <div class="item">
      <span>🌐</span>
      <p>Websites</p>
      <p>🔒 LOCKED</p>
    </div>

    <div class="item">
      <span>📁</span>
      <p>Files</p>
      <p>🔒 LOCKED</p>
    </div>

    <div class="item">
      <span>💻</span>
      <p>Applications</p>
      <p>🔒 LOCKED</p>
    </div>

  </div>

  <div class="message">
    WARNING! A hacker has taken control
    of the computer system.

    <p>
      Solve the security challenges
      to restore access and escape!
    </p>
  </div>

  <button onclick="startEscape()">
    BEGIN ESCAPE CHALLENGE →
  </button>

</div>

<script>
function startEscape() {
  window.location.href = "screen4.html";
}
</script>

</body>
</html>
