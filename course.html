
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RIT Login Animation</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  background: #d3d5d6;
  font-family: Arial, sans-serif;
  color: #24272c;
}

/* WHOLE SCREEN */

#wholeScreen {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  background: #d3d5d6;
  transform-origin: center center;
  display: flex;
  flex-direction: column;
}

/* TOP HEADER */

.site-header {
  width: 100%;
  min-height: 90px;
  background: white;
  border-bottom: 4px solid #f76902;
  display: flex;
  align-items: center;
  padding: 18px 5%;
  gap: 18px;
  box-shadow: 0 2px 8px #00000012;
}

.rit-logo {
  font-family: Georgia, serif;
  font-size: 44px;
  font-weight: 900;
  color: #f76902;
  letter-spacing: -3px;
}

.header-name {
  font-size: 16px;
  font-weight: 800;
  line-height: 1.3;
}

.header-right {
  margin-left: auto;
  font-size: 14px;
  color: #666;
  font-weight: bold;
}

/* LOGIN AREA */

.stage {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 30px;
}

.login-card {
  width: min(460px, 88vw);
  background: white;
  padding: 28px;
  border-top: 6px solid #f76902;
  border-radius: 3px;
  box-shadow: 0 4px 12px #0003;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 28px;
}

.rit {
  color: #f76902;
  font-family: Georgia, serif;
  font-size: 39px;
  font-weight: bold;
}

.brand-name {
  font-size: 13px;
  font-weight: 800;
}

h1 {
  text-align: center;
  font-size: 27px;
  margin: 0 0 4px;
}

.subtitle {
  text-align: center;
  margin: 0 0 24px;
  font-size: 16px;
}

.demo-note {
  text-align: center;
  color: #777;
  font-size: 12px;
  margin-bottom: 20px;
}

.field {
  width: 100%;
  padding: 14px;
  margin-bottom: 12px;
  background: white;
  border: 1px solid #d0d3d7;
  color: #222;
  font-size: 15px;
  border-radius: 2px;
}

.field:focus {
  outline: 2px solid #f76902;
  outline-offset: 1px;
}

.password-row {
  position: relative;
}

.password-row input {
  padding-right: 55px;
}

.eye-button {
  position: absolute;
  right: 7px;
  top: 6px;
  background: transparent;
  border: none;
  padding: 9px;
  font-size: 19px;
  cursor: pointer;
}

.login-button {
  width: 100%;
  background: #f76902;
  color: white;
  border: none;
  padding: 15px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.login-button:hover {
  background: #db5700;
}

/* WHOLE SCREEN TILTS 20 DEGREES
   NO ZOOM OR SLIDING */

#wholeScreen.tilt {
  animation: tiltWholeScreen 3.8s ease-in-out forwards;
}

@keyframes tiltWholeScreen {
  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(20deg);
  }
}

/* ACTUAL head.png IMAGE */

#head {
  position: fixed;
  width: 85px;
  height: 85px;
  object-fit: contain;
  left: 8%;
  bottom: 230px;
  visibility: hidden;
  z-index: 100;
  transform-origin: center center;
  pointer-events: none;
}

/* FALL, BOUNCE TWICE, ROLL LEFT TO RIGHT */


#head.rolling {
  visibility: visible;
  animation: headRoll 3.5s linear forwards;
  will-change: transform;
}

@keyframes headRoll {
  0% {
    left: 8%;
    bottom: 230px;
    transform: rotate(0deg);
  }

  20% {
    left: 24%;
    bottom: 10px;
    transform: rotate(180deg);
  }

  32% {
    left: 34%;
    bottom: 65px;
    transform: rotate(288deg);
  }

  44% {
    left: 44%;
    bottom: 10px;
    transform: rotate(396deg);
  }

  54% {
    left: 52%;
    bottom: 30px;
    transform: rotate(486deg);
  }

  64% {
    left: 60%;
    bottom: 10px;
    transform: rotate(576deg);
  }

  100% {
    left: calc(100% - 100px);
    bottom: 10px;
    transform: rotate(900deg);
  }
}



/* MOBILE */

@media (max-width: 480px) {
  .site-header {
    min-height: 75px;
    padding: 12px 18px;
    gap: 10px;
  }

  .rit-logo {
    font-size: 35px;
  }

  .header-name {
    font-size: 12px;
  }

  .header-right {
    display: none;
  }

  .login-card {
    padding: 20px;
  }

  #head {
    width: 70px;
    height: 70px;
  }

  .go-back,
  .restart {
    top: auto;
    bottom: 16px;
    padding: 10px 13px;
  }
}
</style>
</head>

<body>

<!-- ENTIRE SCREEN THAT ROTATES -->

<div id="wholeScreen">

  <!-- RIT HEADER -->

  <header class="site-header">

    <div class="rit-logo">
      RIT
    </div>

    <div class="header-name">
      Rochester Institute<br>
      of Technology
    </div>

    <div class="header-right">
      myCourses Login
    </div>

  </header>

  <!-- LOGIN FORM -->

  <main class="stage">

    <form
      id="loginCard"
      class="login-card"
      onsubmit="startAnimation(event)"
      autocomplete="off"
    >

      <div class="brand">

        <span class="rit">RIT</span>

        <span class="brand-name">
          Rochester Institute<br>
          of Technology
        </span>

      </div>

      <h1>RIT Login</h1>

      <p class="subtitle">
        myCourses
      </p>

      <p class="demo-note">
        Fictional demo — do not enter real credentials
      </p>

      <input
        class="field"
        type="text"
        placeholder="Demo username"
        autocomplete="off"
      >

      <div class="password-row">

        <input
          class="field"
          id="password"
          type="password"
          placeholder="Demo password"
          autocomplete="off"
        >

        <button
          class="eye-button"
          type="button"
          onclick="togglePassword()"
          aria-label="Show or hide password"
        >
          👁
        </button>

      </div>

      <button
        class="login-button"
        type="submit"
      >
        Log In
      </button>

    </form>

  </main>

</div>

<!-- YOUR ORIGINAL head.png -->

<img
  id="head"
  src="head.png"
  alt="Rolling bald cartoon head"
>

<!-- GO BACK TO screen2.html -->




<script>
let animationTimer = null;
let goBackTimer = null;

function togglePassword() {
  const password = document.getElementById("password");

  password.type =
    password.type === "password" ? "text" : "password";
}

function startAnimation(event) {
  event.preventDefault();

  clearTimeout(animationTimer);
  clearTimeout(goBackTimer);

  const screen = document.getElementById("wholeScreen");
  const head = document.getElementById("head");

  // Reset animations
  screen.classList.remove("tilt");
  head.classList.remove("rolling");

  void screen.offsetWidth;

  // Tilt entire screen 20 degrees
  screen.classList.add("tilt");

  // Wait 3.8 seconds, then roll head
  animationTimer = setTimeout(() => {

    head.classList.add("rolling");

    // Wait for the 3.5-second rolling animation
    // Then automatically return to screen2.html
    goBackTimer = setTimeout(() => {
      window.location.href = "screen2.html";
    }, 3500);

  }, 3800);
}

function restartAnimation() {
  clearTimeout(animationTimer);
  clearTimeout(goBackTimer);

  document.getElementById("wholeScreen")
    .classList.remove("tilt");

  document.getElementById("head")
    .classList.remove("rolling");
}
</script>


</body>
</html>
