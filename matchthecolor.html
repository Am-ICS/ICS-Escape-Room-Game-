<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Color Wire Matching Puzzle</title>

  <!--
  Color Wire Matching Puzzle
  Code generated with assistance from Google Gemini (Nov 12, 2026)
  Built using standard HTML5 SVG and DOM Pointer Events
  -->

  <style>
    * { box-sizing: border-box; user-select: none; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1d24;
      color: #fff;
      font-family: system-ui, sans-serif;
    }
    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
    }
    .instructions {
      text-align: center;
      margin-bottom: 18px;
      padding: 0 16px;
    }
    .instructions h2 {
      margin: 0 0 6px 0;
      font-size: 22px;
      letter-spacing: 0.5px;
    }
    .instructions p {
      margin: 0;
      font-size: 15px;
      color: #94a3b8;
    }
    .panel {
      position: relative;
      width: 480px;
      max-width: 95vw;
      height: 400px;
      background: #252a34;
      border: 4px solid #3c4252;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      padding: 30px 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }
    .column {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 2;
    }
    .node {
      width: 46px;
      height: 36px;
      border-radius: 6px;
      border: 3px solid #111;
      cursor: pointer;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s;
    }
    .node:hover { transform: scale(1.08); }
    .node.connected { box-shadow: 0 0 12px currentColor; }
    svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    path {
      fill: none;
      stroke-width: 12;
      stroke-linecap: round;
    }
    .controls {
      margin-top: 20px;
      display: flex;
      gap: 16px;
      align-items: center;
      min-height: 28px;
    }
    button {
      padding: 10px 20px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      background: #3b82f6;
      color: white;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
    #status { font-weight: bold; font-size: 20px; color: #4ade80; }
  </style>
</head>
<body>

  <button class="back-btn" onclick="GoBack()">Go Back</button>

  <div class="instructions">
    <h2>Connect the Wires</h2>
    <p>Match each colored wire from left to right to unlock the secret answer.</p>
  </div>

  <div class="panel" id="panel">
    <svg id="wireLayer"></svg>
    <div class="column" id="leftCol"></div>
    <div class="column" id="rightCol"></div>
  </div>

  <div class="controls">
    <span id="status"></span>
  </div>

  <script>
    function GoBack() {
      window.location.href = "screen4.html";
    }

    const COLORS = [
      { id: "red", hex: "#ef4444" },
      { id: "blue", hex: "#3b82f6" },
      { id: "yellow", hex: "#eab308" },
      { id: "green", hex: "#22c55e" }
    ];

    const panel = document.getElementById("panel");
    const wireLayer = document.getElementById("wireLayer");
    const leftCol = document.getElementById("leftCol");
    const rightCol = document.getElementById("rightCol");
    const statusText = document.getElementById("status");

    let activeWire = null;
    let activeStartNode = null;
    let connections = new Map();

    function shuffle(array) {
      return [...array].sort(() => Math.random() - 0.5);
    }

    function getNodeCenter(node) {
      const panelRect = panel.getBoundingClientRect();
      const rect = node.getBoundingClientRect();
      return {
        x: rect.left - panelRect.left + rect.width / 2,
        y: rect.top - panelRect.top + rect.height / 2
      };
    }

    function buildCurve(x1, y1, x2, y2) {
      const tension = Math.abs(x2 - x1) * 0.5;
      return `M ${x1} ${y1} C ${x1 + tension} ${y1}, ${x2 - tension} ${y2}, ${x2} ${y2}`;
    }

    function initGame() {
      leftCol.innerHTML = "";
      rightCol.innerHTML = "";
      wireLayer.innerHTML = "";
      statusText.textContent = "";
      connections.clear();

      const leftItems = shuffle(COLORS);
      const rightItems = shuffle(COLORS);

      leftItems.forEach((item) => {
        leftCol.appendChild(createNode(item, "left"));
      });

      rightItems.forEach((item) => {
        rightCol.appendChild(createNode(item, "right"));
      });
    }

    function createNode(item, side) {
      const div = document.createElement("div");
      div.className = "node";
      div.style.backgroundColor = item.hex;
      div.style.color = item.hex;
      div.dataset.color = item.id;
      div.dataset.side = side;

      if (side === "left") {
        div.addEventListener("pointerdown", (e) => startDrag(e, div, item));
      }
      return div;
    }

    function startDrag(e, node, item) {
      if (connections.has(item.id)) return;

      activeStartNode = node;
      const start = getNodeCenter(node);

      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("stroke", item.hex);
      path.setAttribute("d", buildCurve(start.x, start.y, start.x, start.y));
      wireLayer.appendChild(path);
      activeWire = path;

      window.addEventListener("pointermove", onDrag);
      window.addEventListener("pointerup", endDrag);
    }

    function onDrag(e) {
      if (!activeWire || !activeStartNode) return;
      const panelRect = panel.getBoundingClientRect();
      const start = getNodeCenter(activeStartNode);
      const curX = e.clientX - panelRect.left;
      const curY = e.clientY - panelRect.top;

      activeWire.setAttribute("d", buildCurve(start.x, start.y, curX, curY));
    }

    function endDrag(e) {
      window.removeEventListener("pointermove", onDrag);
      window.removeEventListener("pointerup", endDrag);

      if (!activeWire || !activeStartNode) return;

      const target = document.elementFromPoint(e.clientX, e.clientY);
      const isMatch =
        target &&
        target.classList.contains("node") &&
        target.dataset.side === "right" &&
        target.dataset.color === activeStartNode.dataset.color;

      if (isMatch) {
        const start = getNodeCenter(activeStartNode);
        const end = getNodeCenter(target);
        activeWire.setAttribute("d", buildCurve(start.x, start.y, end.x, end.y));

        activeStartNode.classList.add("connected");
        target.classList.add("connected");
        connections.set(activeStartNode.dataset.color, true);

        if (connections.size === COLORS.length) {
          statusText.textContent = "The answer is ogy";
        }
      } else {
        activeWire.remove();
      }

      activeWire = null;
      activeStartNode = null;
    }

    initGame();
  </script>
</body>
</html>
