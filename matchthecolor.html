
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HACKED - Easy Challenge</title>

<style>
* {
  box-sizing: border-box;
  user-select: none;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #09090c;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 35px 20px;
}

.heading {
  text-align: center;
  margin-bottom: 25px;
}

.subtitle {
  color: #ff5555;
  font-size: 12px;
  letter-spacing: 3px;
}

h1 {
  color: #ff4545;
  text-shadow: 0 0 15px #b40000;
  margin: 10px 0;
}

.instructions {
  color: #aaa;
  font-size: 14px;
  line-height: 1.6;
  text-align: center;
}

.game-container {
  width: 100%;
  max-width: 550px;
  background: #140d11;
  border: 1px solid #b43a42;
  border-radius: 12px;
  padding: 25px;
  box-shadow: 0 0 25px #7a151b55;
}

.panel {
  position: relative;
  width: 100%;
  height: 360px;
  background: #231317;
  border: 2px solid #b43a42;
  border-radius: 8px;
  display: flex;
  justify-content: space-between;
  padding: 25px 20px;
  touch-action: none;
}

.column {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  z-index: 2;
}

.node {
  width: 46px;
  height: 36px;
  border-radius: 6px;
  border: 3px solid #09090c;
  cursor: pointer;
  touch-action: none;
  transition: transform 0.15s;
}

.node:hover {
  transform: scale(1.08);
}

.node.connected {
  box-shadow: 0 0 15px currentColor;
}

svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}

path {
  fill: none;
  stroke-width: 10;
  stroke-linecap: round;
}

#status {
  min-height: 30px;
  margin-top: 20px;
  color: #45df83;
  font-size: 20px;
  font-weight: bold;
  text-align: center;
}

button {
  padding: 12px 25px;
  background: #c62828;
  color: white;
  border: none;
  border-radius: 5px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #ff4545;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 20px;
}

.back {
  background: transparent;
  border: 1px solid #e34b54;
}

.back:hover {
  background: #672027;
}

.footer {
  margin-top: 20px;
  color: #777;
  font-size: 12px;
  text-align: center;
}
</style>
</head>

<body>

<div class="heading">
  <p class="subtitle">HACKED // EASY CHALLENGE</p>
  <h1>🔌 CONNECT THE WIRES</h1>
  <p class="instructions">
    Match each colored wire from left to right.<br>
    Connect all four wires to unlock the secret answer.
  </p>
</div>

<div class="game-container">

  <div class="panel" id="panel">
    <svg id="wireLayer"></svg>
    <div class="column" id="leftCol"></div>
    <div class="column" id="rightCol"></div>
  </div>

  <p id="status"></p>

  <div class="buttons">
    <button onclick="initGame()">RESET</button>

    <button class="back"
      onclick="window.location.href='screen4.html'">
      ← BACK TO CHALLENGES
    </button>
  </div>

</div>

<p class="footer">HACKED // ESCAPE ROOM</p>

<script>
const COLORS = [
  { id: "red", hex: "#ef4444" },
  { id: "blue", hex: "#3b82f6" },
  { id: "yellow", hex: "#eab308" },
  { id: "green", hex: "#22c55e" }
];

const panel = document.getElementById("panel");
const wireLayer = document.getElementById("wireLayer");
const leftCol = document.getElementById("leftCol");
const rightCol = document.getElementById("rightCol");
const statusText = document.getElementById("status");

let activeWire = null;
let activeStartNode = null;
let connections = new Map();

function shuffle(array) {
  const copy = [...array];

  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }

  return copy;
}

function getNodeCenter(node) {
  const panelRect = panel.getBoundingClientRect();
  const rect = node.getBoundingClientRect();

  return {
    x: rect.left - panelRect.left + rect.width / 2,
    y: rect.top - panelRect.top + rect.height / 2
  };
}

function buildCurve(x1, y1, x2, y2) {
  const tension = Math.abs(x2 - x1) * 0.5;

  return `M ${x1} ${y1}
          C ${x1 + tension} ${y1},
            ${x2 - tension} ${y2},
            ${x2} ${y2}`;
}

function initGame() {
  window.removeEventListener("pointermove", onDrag);
  window.removeEventListener("pointerup", endDrag);
  window.removeEventListener("pointercancel", cancelDrag);

  activeWire = null;
  activeStartNode = null;

  leftCol.innerHTML = "";
  rightCol.innerHTML = "";
  wireLayer.innerHTML = "";
  statusText.textContent = "";
  connections.clear();

  const leftItems = shuffle(COLORS);
  const rightItems = shuffle(COLORS);

  leftItems.forEach(item => {
    leftCol.appendChild(createNode(item, "left"));
  });

  rightItems.forEach(item => {
    rightCol.appendChild(createNode(item, "right"));
  });
}

function createNode(item, side) {
  const div = document.createElement("div");

  div.className = "node";
  div.style.backgroundColor = item.hex;
  div.style.color = item.hex;
  div.dataset.color = item.id;
  div.dataset.side = side;

  if (side === "left") {
    div.addEventListener("pointerdown", e => {
      startDrag(e, div, item);
    });
  }

  return div;
}

function startDrag(e, node, item) {
  if (connections.has(item.id)) return;

  e.preventDefault();

  activeStartNode = node;

  const start = getNodeCenter(node);

  const path = document.createElementNS(
    "http://www.w3.org/2000/svg",
    "path"
  );

  path.setAttribute("stroke", item.hex);
  path.setAttribute(
    "d",
    buildCurve(start.x, start.y, start.x, start.y)
  );

  wireLayer.appendChild(path);
  activeWire = path;

  window.addEventListener("pointermove", onDrag);
  window.addEventListener("pointerup", endDrag);
  window.addEventListener("pointercancel", cancelDrag);
}

function onDrag(e) {
  if (!activeWire || !activeStartNode) return;

  const panelRect = panel.getBoundingClientRect();
  const start = getNodeCenter(activeStartNode);

  const curX = e.clientX - panelRect.left;
  const curY = e.clientY - panelRect.top;

  activeWire.setAttribute(
    "d",
    buildCurve(start.x, start.y, curX, curY)
  );
}

function endDrag(e) {
  window.removeEventListener("pointermove", onDrag);
  window.removeEventListener("pointerup", endDrag);
  window.removeEventListener("pointercancel", cancelDrag);

  if (!activeWire || !activeStartNode) return;

  const target = document.elementFromPoint(
    e.clientX,
    e.clientY
  );

  const isMatch =
    target &&
    target.classList.contains("node") &&
    target.dataset.side === "right" &&
    target.dataset.color === activeStartNode.dataset.color;

  if (isMatch) {
    const start = getNodeCenter(activeStartNode);
    const end = getNodeCenter(target);

    activeWire.setAttribute(
      "d",
      buildCurve(start.x, start.y, end.x, end.y)
    );

    activeStartNode.classList.add("connected");
    target.classList.add("connected");

    connections.set(activeStartNode.dataset.color, true);

    if (connections.size === COLORS.length) {
      statusText.textContent = "🔓 ACCESS GRANTED! CODE: OGY";

      sessionStorage.setItem("easyComplete", "true");
    }
  } else {
    activeWire.remove();
  }

  activeWire = null;
  activeStartNode = null;
}

function cancelDrag() {
  window.removeEventListener("pointermove", onDrag);
  window.removeEventListener("pointerup", endDrag);
  window.removeEventListener("pointercancel", cancelDrag);

  if (activeWire) {
    activeWire.remove();
  }

  activeWire = null;
  activeStartNode = null;
}

initGame();
</script>

</body>
</html>
