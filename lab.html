
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>RIT Computer Lab | HACKED</title>

  <!-- THREE.JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    /* ========================================
       1. PAGE SETUP
    ======================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #030000;
      font-family: "Courier New", monospace;
    }

    /* ========================================
       2. 3D CANVAS
    ======================================== */

    #game3D {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ========================================
       3. RED MATRIX BACKGROUND
    ======================================== */

    #matrix {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.28;
      pointer-events: none;
    }

    /* ========================================
       4. HORROR SCREEN EFFECTS
    ======================================== */

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;

      background: radial-gradient(
        ellipse at center,
        transparent 15%,
        rgba(30, 0, 0, 0.3) 55%,
        rgba(0, 0, 0, 0.95) 100%
      );
    }

    .scanlines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.15;

      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        black 4px,
        black 5px
      );
    }

    .red-flash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: rgba(255, 0, 0, 0.2);
      opacity: 0;
      animation: flash 2s infinite;
    }

    @keyframes flash {
      0%, 84%, 100% {
        opacity: 0;
      }

      87% {
        opacity: 0.8;
      }

      90% {
        opacity: 0;
      }

      93% {
        opacity: 0.5;
      }
    }

    /* ========================================
       5. WARNING TEXT
    ======================================== */

    .warning {
      position: fixed;
      top: 7%;
      left: 0;
      width: 100%;
      padding: 0 15px;

      text-align: center;
      font-size: clamp(28px, 6vw, 75px);
      font-weight: 900;
      letter-spacing: 3px;
      color: #ff2020;

      text-shadow:
        0 0 10px red,
        0 0 25px red,
        0 0 50px darkred;

      animation: glitch 1.4s infinite;
      pointer-events: none;
    }

    @keyframes glitch {
      0%, 90%, 100% {
        transform: translate(0);
      }

      92% {
        transform: translate(-5px, 2px);
      }

      94% {
        transform: translate(5px, -3px);
      }

      96% {
        transform: translate(-3px, -2px);
      }
    }

    /* ========================================
       6. EVIL LAUGH
    ======================================== */

    .evil-laugh {
      position: fixed;
      bottom: 11%;
      left: 0;
      width: 100%;
      padding: 0 15px;

      text-align: center;
      font-size: clamp(24px, 4vw, 48px);
      font-weight: bold;
      letter-spacing: 4px;
      color: #ff3434;

      text-shadow:
        0 0 12px red,
        0 0 30px darkred;

      animation: laughShake 0.25s infinite alternate;
      pointer-events: none;
    }

    @keyframes laughShake {
      from {
        transform: rotate(-1deg);
      }

      to {
        transform: rotate(1deg);
      }
    }

    /* ========================================
       7. BOTTOM TEXT
    ======================================== */

    .status {
      position: fixed;
      bottom: 4%;
      width: 100%;
      text-align: center;

      color: #a94444;
      font-size: 12px;
      letter-spacing: 3px;
      pointer-events: none;
    }

    /* ========================================
       8. FADE TRANSITION
    ======================================== */

    #fade {
      position: fixed;
      inset: 0;
      background: black;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      z-index: 20;
    }

    #fade.active {
      opacity: 1;
    }

    /* ========================================
       9. MOBILE ADJUSTMENTS
    ======================================== */

    @media (max-width: 650px) {
      .warning {
        top: 9%;
      }

      .evil-laugh {
        bottom: 15%;
      }
    }

  </style>
</head>

<body>

  <!-- 3D WORLD -->
  <canvas id="game3D"></canvas>

  <!-- MATRIX RAIN -->
  <canvas id="matrix"></canvas>

  <!-- SCREEN EFFECTS -->
  <div class="vignette"></div>
  <div class="scanlines"></div>
  <div class="red-flash"></div>

  <!-- WARNING -->
  <h1 class="warning">
    YOU ARE STUCK IN HERE!
  </h1>

  <!-- HACKER LAUGH -->
  <h2 class="evil-laugh">
    MWAHAHAHAHAHA!!!
  </h2>

  <!-- STATUS -->
  <div class="status">
    SYSTEM COMPROMISED
  </div>

  <!-- FADE -->
  <div id="fade"></div>


  <script>
    /* ========================================
       10. GAME SETTINGS
    ======================================== */

    const NEXT_PAGE = "screen2.html";
    const SCENE_DURATION = 3000;

    /* ========================================
       11. THREE.JS SETUP
    ======================================== */

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x030000);

    scene.fog = new THREE.FogExp2(
      0x140000,
      0.045
    );

    const camera = new THREE.PerspectiveCamera(
      55,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );

    camera.position.set(0, 1.6, 7.5);

    const renderer = new THREE.WebGLRenderer({
      canvas: document.getElementById("game3D"),
      antialias: true
    });

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    /* ========================================
       12. MATERIALS
    ======================================== */

    const hoodieMaterial = new THREE.MeshStandardMaterial({
      color: 0x111216,
      roughness: 0.95,
      side: THREE.DoubleSide
    });

    const darkMaterial = new THREE.MeshStandardMaterial({
      color: 0x050505,
      roughness: 1
    });

    const trimMaterial = new THREE.MeshStandardMaterial({
      color: 0x5b0808,
      roughness: 0.8
    });

    const eyeMaterial = new THREE.MeshBasicMaterial({
      color: 0xff1717
    });

    const wallMaterial = new THREE.MeshStandardMaterial({
      color: 0x100507,
      roughness: 1
    });

    /* ========================================
       13. HELPER FUNCTION
    ======================================== */

    function createMesh(
      geometry,
      material,
      parent,
      x = 0,
      y = 0,
      z = 0
    ) {
      const object = new THREE.Mesh(
        geometry,
        material
      );

      object.position.set(x, y, z);

      parent.add(object);

      return object;
    }

    /* ========================================
       14. BUILD THE DARK ROOM
    ======================================== */

    const floor = createMesh(
      new THREE.PlaneGeometry(30, 30),
      wallMaterial,
      scene,
      0,
      -1,
      0
    );

    floor.rotation.x = -Math.PI / 2;

    const backWall = createMesh(
      new THREE.PlaneGeometry(30, 15),
      wallMaterial,
      scene,
      0,
      5,
      -5
    );

    // Red glowing strips on the floor

    for (let i = -6; i <= 6; i += 2) {
      createMesh(
        new THREE.BoxGeometry(0.025, 0.02, 18),
        trimMaterial,
        scene,
        i,
        -0.98,
        0
      );
    }

    /* ========================================
       15. LIGHTING
    ======================================== */

    const ambientLight = new THREE.AmbientLight(
      0x661111,
      0.9
    );

    scene.add(ambientLight);

    const redLight = new THREE.PointLight(
      0xff1010,
      3,
      15
    );

    redLight.position.set(0, 3, 2);

    scene.add(redLight);

    const backLight = new THREE.PointLight(
      0xaa0011,
      2,
      12
    );

    backLight.position.set(-3, 2, -1);

    scene.add(backLight);

    /* ========================================
       16. CREATE THE 3D HACKER
    ======================================== */

    const hacker = new THREE.Group();

    scene.add(hacker);

    // BODY

    const body = createMesh(
      new THREE.SphereGeometry(1, 32, 24),
      hoodieMaterial,
      hacker,
      0,
      0.3,
      0
    );

    body.scale.set(1.4, 1.1, 0.75);

    // LEFT ARM

    const leftArm = createMesh(
      new THREE.CylinderGeometry(
        0.35,
        0.48,
        1.7,
        20
      ),
      hoodieMaterial,
      hacker,
      -1.15,
      -0.2,
      0
    );

    leftArm.rotation.z = -0.2;

    // RIGHT ARM

    const rightArm = createMesh(
      new THREE.CylinderGeometry(
        0.35,
        0.48,
        1.7,
        20
      ),
      hoodieMaterial,
      hacker,
      1.15,
      -0.2,
      0
    );

    rightArm.rotation.z = 0.2;

    // LARGE HOOD

    const hood = createMesh(
      new THREE.SphereGeometry(
        0.9,
        36,
        28
      ),
      hoodieMaterial,
      hacker,
      0,
      1.5,
      0.1
    );

    hood.scale.set(1, 1.25, 0.9);

    // DARK FACE

    const face = createMesh(
      new THREE.SphereGeometry(
        0.68,
        32,
        24
      ),
      darkMaterial,
      hacker,
      0,
      1.45,
      0.78
    );

    face.scale.set(1, 1.05, 0.35);

    // HOOD RED OUTLINE

    const hoodOutline = createMesh(
      new THREE.TorusGeometry(
        0.69,
        0.055,
        12,
        48
      ),
      trimMaterial,
      hacker,
      0,
      1.48,
      0.99
    );

    hoodOutline.scale.set(1, 1.15, 1);

    // GLOWING EYES

    function createEye(x) {
      const eye = createMesh(
        new THREE.SphereGeometry(
          0.16,
          20,
          12
        ),
        eyeMaterial,
        hacker,
        x,
        1.57,
        1.08
      );

      eye.scale.set(1.2, 0.32, 0.4);

      const eyeLight = new THREE.PointLight(
        0xff0000,
        1.2,
        2
      );

      eyeLight.position.set(
        x,
        1.57,
        1.15
      );

      hacker.add(eyeLight);
    }

    createEye(-0.3);
    createEye(0.3);

    /* ========================================
       17. FLOATING RED PARTICLES
    ======================================== */

    const particles = [];

    const particleMaterial = new THREE.MeshBasicMaterial({
      color: 0xff2020
    });

    for (let i = 0; i < 65; i++) {
      const particle = createMesh(
        new THREE.SphereGeometry(
          0.015,
          5,
          5
        ),
        particleMaterial,
        scene,
        (Math.random() - 0.5) * 12,
        Math.random() * 6 - 1,
        (Math.random() - 0.5) * 8
      );

      particles.push({
        mesh: particle,
        speed: 0.2 + Math.random() * 0.6
      });
    }

    /* ========================================
       18. RED MATRIX RAIN
    ======================================== */

    const matrixCanvas = document.getElementById("matrix");

    const matrixContext = matrixCanvas.getContext("2d");

    const letters = "01ABCDEF#$%&@RITERRORHACKED";

    const fontSize = 17;

    let drops = [];

    function resizeMatrix() {
      matrixCanvas.width = window.innerWidth;
      matrixCanvas.height = window.innerHeight;

      const columns = Math.ceil(
        matrixCanvas.width / fontSize
      );

      drops = Array.from(
        { length: columns },
        () => -Math.random() * 50
      );
    }

    function drawMatrix() {
      matrixContext.fillStyle = "rgba(0,0,0,0.08)";

      matrixContext.fillRect(
        0,
        0,
        matrixCanvas.width,
        matrixCanvas.height
      );

      matrixContext.fillStyle = "#ff1717";

      matrixContext.font = fontSize + "px monospace";

      for (let i = 0; i < drops.length; i++) {
        const letter = letters[
          Math.floor(Math.random() * letters.length)
        ];

        matrixContext.fillText(
          letter,
          i * fontSize,
          drops[i] * fontSize
        );

        if (
          drops[i] * fontSize > matrixCanvas.height &&
          Math.random() > 0.975
        ) {
          drops[i] = 0;
        }

        drops[i]++;
      }
    }

    resizeMatrix();

    setInterval(drawMatrix, 45);

    /* ========================================
       19. ANIMATION LOOP
    ======================================== */

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const time = clock.getElapsedTime();

      // Hacker floats

      hacker.position.y =
        Math.sin(time * 2) * 0.13;

      // Hacker slowly turns

      hacker.rotation.y =
        Math.sin(time * 0.8) * 0.12;

      // Camera slowly approaches

      camera.position.z = Math.max(
        5.1,
        7.5 - time * 0.65
      );

      camera.position.x =
        Math.sin(time * 0.6) * 0.1;

      camera.lookAt(0, 1.2, 0);

      // Flickering red light

      redLight.intensity =
        2.5 + Math.sin(time * 9) * 0.6;

      // Floating particles

      particles.forEach((particle) => {
        particle.mesh.position.y +=
          particle.speed * 0.015;

        if (particle.mesh.position.y > 5) {
          particle.mesh.position.y = -1;
        }
      });

      renderer.render(scene, camera);
    }

    animate();

    /* ========================================
       20. WINDOW RESIZE
    ======================================== */

    window.addEventListener("resize", () => {
      camera.aspect =
        window.innerWidth / window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

      resizeMatrix();
    });

    /* ========================================
       21. RETURN TO SCREEN 2
    ======================================== */

    function goBack() {
      document.getElementById("fade")
        .classList.add("active");

      setTimeout(() => {
        window.location.href = NEXT_PAGE;
      }, 500);
    }

    setTimeout(goBack, SCENE_DURATION);

  </script>

</body>
</html>
