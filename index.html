
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HACKED - Escape Room</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #101018;
      font-family: Arial, sans-serif;
    }

    .screen {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      position: relative;
      background-image: url("intro.png");
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
    }

    .next-btn {
      position: absolute;
      bottom: 5%;
      right: 5%;
      padding: 15px 35px;
      background: #ff7300;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .next-btn:hover {
      background: #ff9500;
    }
  </style>
</head>

<body>

  <div class="screen">
    <button class="next-btn" onclick="nextScreen()">
      NEXT ➜
    </button>
  </div>

  <script>
    function nextScreen() {
      window.location.href = "screen2.html";
    }
  </script>

</body>
</html>
