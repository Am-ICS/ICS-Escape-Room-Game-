
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICS Escape Room - Cinematic</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
    overflow-x: hidden;
  overflow-y: auto;
}

/* SCROLLABLE TEACHER MENU */
#teacherMenu {
  overflow-x: hidden;
  overflow-y: auto;
  align-items: flex-start;
  scrollbar-width: thin;
  scrollbar-color: #ff3030 #100000;
}

#teacherMenu .encounter {
  margin: auto;
  padding: 35px 15px 50px;
}

/* RED SCROLLBAR */
#teacherMenu::-webkit-scrollbar {
  width: 10px;
}

#teacherMenu::-webkit-scrollbar-track {
  background: #100000;
}

#teacherMenu::-webkit-scrollbar-thumb {
  background: #ff3030;
  border-radius: 10px;
}

#teacherMenu::-webkit-scrollbar-thumb:hover {
  background: #ff6666;
}


body {
  background: #000;
  color: white;
  font-family: "Courier New", monospace;
}

/* 3D LAB CONTROLS DESIGN */
#labControls {
  width: min(560px, 90vw);
  padding: 20px 25px;
  background: rgba(20, 0, 0, 0.9);
  border: 2px solid #ff3030;
  border-radius: 14px;
  color: #ffcccc;
  font: bold 15px "Courier New", monospace;
  line-height: 1.8;
  text-align: center;
  box-shadow: 0 0 25px #ff000055;
}

#labControls:hover {
  border-color: #ff6666;
  box-shadow: 0 0 35px #ff000088;
}

#game {
  position: fixed;
  inset: 0;
}

#game canvas {
  display: block;
}

/* CINEMATIC BLACK BARS */

.cinematic-bar {
  position: fixed;
  left: 0;
  width: 100%;
  height: 7vh;
  background: #000;
  z-index: 4;
  pointer-events: none;
}

.cinematic-bar.top {
  top: 0;
}

.cinematic-bar.bottom {
  bottom: 0;
}

/* DARK RED VIGNETTE */

#vignette {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 3;
  background: radial-gradient(
    circle,
    transparent 25%,
    rgba(30, 0, 0, .45) 65%,
    rgba(0, 0, 0, .9) 100%
  );
}

/* BLACKOUT / LIGHTS RETURN */
#blackout { position:fixed; inset:0; z-index:30; background:#000; pointer-events:none; animation:powerOn 5s forwards; }
@keyframes powerOn { 0%,38% {opacity:1} 50%{opacity:.92} 56%{opacity:.5} 61%{opacity:1} 72%{opacity:.65} 78%{opacity:.95} 100%{opacity:0} }
#noise {position:fixed;inset:0;z-index:6;pointer-events:none;opacity:.13;background:repeating-linear-gradient(0deg,transparent 0px,transparent 3px,#fff 4px,transparent 5px);animation:staticMove .12s steps(2) infinite;}
@keyframes staticMove {to{transform:translateY(7px)}}
#teacherMenu .encounter {width:min(900px,95vw);display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;}
#paranoidImage {width:min(500px,90vw);max-height:60vh;object-fit:contain;filter:drop-shadow(0 0 28px #a00);}
#panicText {font:bold clamp(20px,4vw,36px) 'Courier New',monospace;color:#ff3434;text-shadow:0 0 20px red;animation:glitch 1.4s infinite;}
@keyframes glitch {0%,92%,100%{transform:translateX(0)}94%{transform:translateX(-4px)}96%{transform:translateX(4px)}}
#escapeButton {font:bold 24px 'Courier New',monospace;background:#200000;color:white;border:2px solid red;border-radius:12px;padding:18px 60px;cursor:pointer;box-shadow:0 0 24px #f00;animation:escapePulse 1.5s infinite;}
#escapeButton:hover {background:#b00;}
@keyframes escapePulse {50%{box-shadow:0 0 45px red}}
/* STATUS TEXT */

#status {
  position: fixed;
  bottom: 12vh;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
  color: #ff3030;
  font-size: clamp(12px, 2vw, 20px);
  letter-spacing: 4px;
  text-align: center;
  text-shadow: 0 0 15px red;
  opacity: 0;
  transition: opacity .5s;
  pointer-events: none;
}

/* RED FLASH */

#flash {
  position: fixed;
  inset: 0;
  z-index: 15;
  background: #ff0000;
  opacity: 0;
  pointer-events: none;
}

#flash.active {
  animation: redFlash .7s ease-out;
}

@keyframes redFlash {
  0% { opacity: 0; }
  20% { opacity: .6; }
  100% { opacity: 0; }
}

/* BALD GUY ENCOUNTER */
#teacherMenu {position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:radial-gradient(circle,#300000,#000 75%);padding:16px;opacity:0;transition:opacity 1.2s ease;}
#teacherMenu.visible {opacity:1;}

/* SKIP CINEMATIC BUTTON */
#skipCinematic {
  position:fixed; bottom:9vh; right:20px; z-index:40;
  padding:12px 20px; border:2px solid #ff3030;
  border-radius:10px; background:#200000; color:#fff;
  font:bold 15px "Courier New",monospace; cursor:pointer;
  box-shadow:0 0 18px #f005;
}
#skipCinematic:hover {background:#9b0000;}
#skipCinematic:focus-visible {outline:3px solid white;}

/* CINEMATIC HORROR REDESIGN */
:root{--blood:#ff324b;--pale:#ffe1e4}
body{background:#060103}
#vignette{background:radial-gradient(ellipse at center,transparent 18%,rgba(48,0,9,.27) 58%,#000 100%)}
#noise{opacity:.075;mix-blend-mode:screen}
#status{bottom:12vh;max-width:90%;font-weight:900;font-size:clamp(13px,1.7vw,19px);letter-spacing:clamp(1px,.4vw,4px);color:#ff7a8b;text-shadow:0 0 24px #f12}
#skipCinematic{bottom:9vh;right:24px;background:linear-gradient(120deg,#29070d,#10070b);border:1px solid #ff627a;border-radius:4px;letter-spacing:2px;box-shadow:0 0 20px #ff27442b}
#teacherMenu{background:radial-gradient(ellipse at 50% 35%,#360812 0%,#140409 45%,#030103 100%)}
#teacherMenu .encounter{width:min(880px,95vw);padding:38px 20px 65px;gap:15px;border:1px solid #742030;background:linear-gradient(145deg,#20060bd9,#080306ee);box-shadow:0 0 80px #000, inset 0 0 60px #a516261c;position:relative}
#teacherMenu .encounter::before{content:'ICS // EMERGENCY BROADCAST';display:block;font:bold 11px 'Courier New',monospace;color:#ff8294;letter-spacing:4px;margin-bottom:2px}
#paranoidImage{width:min(310px,65vw);max-height:30vh;filter:drop-shadow(0 0 20px #c3203c66)}
#panicText{font-size:clamp(20px,3.6vw,35px);line-height:1.3;letter-spacing:1px;color:#ff536b;text-shadow:0 0 25px #d71936}
#labControls{width:min(580px,95%);padding:17px 22px;background:#11070ce8;border:1px solid #a93a50;border-left:4px solid #ff455e;border-radius:4px;box-shadow:inset 0 0 30px #ff1e3111;color:#ffd3db;font-size:clamp(12px,1.5vw,14px);line-height:1.55}
#escapeButton{font-size:clamp(15px,2.5vw,20px);letter-spacing:2px;background:linear-gradient(100deg,#7c1028,#b52237);border:1px solid #ff778a;border-radius:4px;padding:17px 30px;box-shadow:0 0 26px #ff224a66}
#escapeButton:hover{background:#da2b45;transform:translateY(-2px)}
@media(max-height:730px){#teacherMenu .encounter{padding-top:20px;gap:9px}#paranoidImage{max-height:20vh}#labControls{line-height:1.35;padding:12px}}

</style>
</head>

<body>

<div id="game"></div>
<button id="skipCinematic" type="button">SKIP INTRO ⏭</button>

<div class="cinematic-bar top"></div>
<div class="cinematic-bar bottom"></div>

<div id="vignette"></div>
<div id="flash"></div>
<div id="status"></div>

<div id="noise"></div>
<div id="blackout"></div>
<!-- SCARED GUIDE AFTER THE DOOR OPENS -->
<div id="teacherMenu">
  <div class="encounter">
    <img id="paranoidImage" src="paranoid.png" alt="Terrified ICS guide">

    <div id="panicText">
      😱 OMG! WHAT HAPPENED?!<br>
      WE ARE HACKED! PLEASE HELP US!
    </div>

    <div id="labControls">
      🎮 SURVIVAL CONTROLS<br><br>
      W = Walk Forward<br>
      A = Move Left<br>
      S = Walk Backward<br>
      D = Move Right<br>
      🖱️ MOUSE = Look Around (No Holding)<br>
      SHIFT = Run<br>
      E = Interact with Computers<br><br>
      🔓 Complete all 3 puzzles to unlock the exit!
    </div>

    <button id="escapeButton"
            onclick="window.location.href='screen3.html'">
      ENTER THE HACKED LAB →
    </button>
  </div>
</div>
</div></div>
<script src="disablekeyboard.js"></script>
<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js";

/* SCENE */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x090204);
scene.fog = new THREE.Fog(0x160407, 5, 38);

/* CAMERA */

const camera = new THREE.PerspectiveCamera(
  72,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);

camera.position.set(0, 1.7, 14);
camera.rotation.order = "YXZ";

/* RENDERER */

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

document.getElementById("game")
  .appendChild(renderer.domElement);

/* LIGHTS */

scene.add(
  new THREE.AmbientLight(0x440d17, 1.05)
);

const redLight = new THREE.PointLight(
  0xff304b, 24, 20
);

redLight.position.set(0, 3.5, 2);
scene.add(redLight);

const doorLight = new THREE.PointLight(
  0xff3040, 32, 15
);

doorLight.position.set(0, 3.2, -14);
scene.add(doorLight);

/* MATERIALS */

const wallMat = new THREE.MeshStandardMaterial({
  color: 0x24141b,
  roughness: .9
});

const floorMat = new THREE.MeshStandardMaterial({
  color: 0x171016,
  metalness: .3,
  roughness: .5
});

const metalMat = new THREE.MeshStandardMaterial({
  color: 0x080808,
  metalness: .7,
  roughness: .4
});

const redMat = new THREE.MeshBasicMaterial({
  color: 0xff3045
});

const doorMat = new THREE.MeshStandardMaterial({
  color: 0x370000,
  metalness: .7,
  roughness: .4
});

/* BOX HELPER */

function box(w, h, d, x, y, z, mat) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    mat
  );

  mesh.position.set(x, y, z);
  scene.add(mesh);

  return mesh;
}

/* HORROR HALLWAY */

box(7, .2, 36, 0, -.1, 0, floorMat);
box(.3, 4, 36, -3.5, 2, 0, wallMat);
box(.3, 4, 36, 3.5, 2, 0, wallMat);
box(7, .2, 36, 0, 4, 0, wallMat);

box(7, 4, .3, 0, 2, 17.8, wallMat);

/* FLOOR METAL STRIPES */

for (let z = -14; z < 17; z += 2) {
  box(6.8, .02, .06, 0, .02, z, metalMat);
}

/* RED CEILING LIGHTS */

const lights = [];

for (let z = 12; z >= -12; z -= 5) {
  box(2.4, .08, .5, 0, 3.88, z, redMat);
  box(3.1, .04, .1, 0, 3.83, z+.38, redMat);

  const light = new THREE.PointLight(
    0xff0000, 8, 8
  );

  light.position.set(0, 3.5, z);
  scene.add(light);
  lights.push(light);
}

/* WALL CABLES */

for (let z = -12; z < 17; z += 3) {
  box(.12, .12, 2.5, -3.25, 3, z, metalMat);
  box(.12, .12, 2.5, 3.25, 2.7, z, metalMat);
}

/* DETAIL PASS — INDUSTRIAL PANELS, PIPES, CABLE TRAYS AND SERVER ALCOVES */
const darkSteel = new THREE.MeshStandardMaterial({color:0x180d12,metalness:.8,roughness:.45});
const trimSteel = new THREE.MeshStandardMaterial({color:0x57303b,metalness:.75,roughness:.5});
const screenGlow = new THREE.MeshBasicMaterial({color:0xff3e56});
for(let z=-13;z<17;z+=2){
  for(let side of [-1,1]){
    box(.08,3.6,.09,side*3.27,2,z,trimSteel);
    box(.18,.16,1.9,side*3.17,3.3,z,darkSteel);
    box(.11,.035,.22,side*3.14,3.18,z,screenGlow);
    box(.13,.06,1.2,side*3.19,.55,z,darkSteel);
  }
  box(6.8,.055,.065,0,3.94,z,trimSteel);
}
for(let z=-10;z<=12;z+=5){
  for(let side of [-1,1]){
    const x=side*2.95;
    box(.58,2.5,1.2,x,1.28,z,darkSteel);
    box(.62,.08,1.25,x,2.58,z,trimSteel);
    for(let y=.3;y<2.4;y+=.28){
      box(.05,.14,.93,x-side*.32,y,z,trimSteel);
      box(.065,.045,.055,x-side*.37,y,z+.35,screenGlow);
    }
  }
}
for(let z=-12;z<=14;z+=2.5){
  box(1.8,.022,.82,0,.018,z,darkSteel);
  for(let i=0;i<5;i++)box(1.6,.03,.04,0,.036,z-.31+i*.15,trimSteel);
}
// Dust drifting through the light shafts.
const dustGeometry=new THREE.BufferGeometry();
const dustPositions=new Float32Array(360*3);
for(let i=0;i<360;i++){
 dustPositions[i*3]=(Math.random()-.5)*6.5;
 dustPositions[i*3+1]=Math.random()*3.9;
 dustPositions[i*3+2]=(Math.random()-.5)*34;
}
dustGeometry.setAttribute('position',new THREE.BufferAttribute(dustPositions,3));
const dust=new THREE.Points(dustGeometry,new THREE.PointsMaterial({color:0xffb6c0,size:.027,transparent:true,opacity:.4,depthWrite:false}));
scene.add(dust);

/* WARNING SIGNS */

function makeSign(text, x, y, z, rotation) {
  const canvas = document.createElement("canvas");
  canvas.width = 512;
  canvas.height = 256;

  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#080000";
  ctx.fillRect(0, 0, 512, 256);

  ctx.strokeStyle = "#ff0000";
  ctx.lineWidth = 12;
  ctx.strokeRect(8, 8, 496, 240);

  ctx.fillStyle = "#ff2020";
  ctx.font = "bold 40px monospace";
  ctx.textAlign = "center";
  ctx.fillText(text, 256, 145);

  const texture = new THREE.CanvasTexture(canvas);

  const sign = new THREE.Mesh(
    new THREE.PlaneGeometry(2.5, 1.25),
    new THREE.MeshBasicMaterial({
      map: texture,
      side: THREE.DoubleSide
    })
  );

  sign.position.set(x, y, z);
  sign.rotation.y = rotation;
  scene.add(sign);
}

makeSign("SYSTEM HACKED", -3.31, 2, 6, Math.PI / 2);
makeSign("ACCESS DENIED", 3.31, 2, 1, -Math.PI / 2);
makeSign("DO NOT ENTER", -3.31, 2, -8, Math.PI / 2);
makeSign("IT SEES YOU", 3.31, 2, -11, -Math.PI / 2);

/* DOOR WALL */

box(2.4, 4, .3, -2.3, 2, -15, wallMat);
box(2.4, 4, .3, 2.3, 2, -15, wallMat);
box(2.2, 1, .3, 0, 3.5, -15, wallMat);

/* DOOR */

const doorPivot = new THREE.Group();
doorPivot.position.set(-1.1, 0, -14.8);
scene.add(doorPivot);

const door = new THREE.Mesh(
  new THREE.BoxGeometry(2.2, 3, .16),
  doorMat
);

door.position.set(1.1, 1.5, 0);
doorPivot.add(door);

/* DOOR HANDLE */

const handle = new THREE.Mesh(
  new THREE.SphereGeometry(.1, 16, 16),
  redMat
);

handle.position.set(2, 1.5, .15);
doorPivot.add(handle);

/* RED DOOR FRAME */

box(.2, 3.2, .35, -1.2, 1.6, -14.8, redMat);
box(.2, 3.2, .35, 1.2, 1.6, -14.8, redMat);
box(2.6, .2, .35, 0, 3.1, -14.8, redMat);

/* DOOR SIGN */

makeSign("ICS ESCAPE ROOM", 0, 3.55, -14.6, 0);

/* ROOM BEHIND DOOR */

box(7, .2, 10, 0, -.1, -20, floorMat);
box(7, .2, 10, 0, 4, -20, wallMat);
box(.3, 4, 10, -3.5, 2, -20, wallMat);
box(.3, 4, 10, 3.5, 2, -20, wallMat);
box(7, 4, .3, 0, 2, -25, wallMat);

/* HACKER MONITORS */

const screenMat = new THREE.MeshBasicMaterial({
  color: 0x990000
});

for (let x of [-2, 0, 2]) {
  box(1.5, 1, .15, x, 2, -24.7, metalMat);
  box(1.3, .8, .17, x, 2, -24.59, screenMat);
}

/* CINEMATIC ANIMATION */

let started = true;
let finished = false;
let doorFlashed = false;
let elapsed = 0;

const TOTAL_DURATION = 20;
const BLACKOUT_DURATION = 5;

const clock = new THREE.Clock();
clock.start();

const status = document.getElementById("status");
const flash = document.getElementById("flash");
const teacherMenu = document.getElementById("teacherMenu");
/* SMOOTH MOVEMENT */

function smoothStep(t) {
  t = Math.max(0, Math.min(1, t));
  return t * t * (3 - 2 * t);
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

/* SHOW STATUS TEXT */

let lastStatus = "";

function showStatus(text) {
  if (text === lastStatus) return;

  lastStatus = text;
  status.textContent = text;
  status.style.opacity = text ? "1" : "0";
}

/* RED FLASH */

function triggerFlash() {
  flash.classList.remove("active");
  void flash.offsetWidth;
  flash.classList.add("active");
}

/* FINISH CINEMATIC */

function finishCinematic() {
  if (finished) return;

  finished = true;
  showStatus("");

  document.getElementById("skipCinematic").style.display = "none";
  document.getElementById("blackout").style.display = "none";
  teacherMenu.style.display = "flex";

  requestAnimationFrame(() => {
    teacherMenu.classList.add("visible");
  });
}

/* SKIP THE CINEMATIC AND OPEN THE EXISTING TEACHER MENU */
document.getElementById("skipCinematic").addEventListener("click", () => {
  if (finished) return;
  started = false;
  doorPivot.rotation.y = -Math.PI / 2;
  camera.position.set(0, 1.7, -21);
  camera.rotation.set(0, 0, 0);
  finishCinematic();
});

/* MAIN ANIMATION */

function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), .05);
  const time = clock.elapsedTime;

  /* FLICKERING LIGHTS */

  redLight.intensity =
    (20 + Math.sin(time * 8) * 6) * (Math.sin(time * 13) > .96 ? .1 : 1);

  doorLight.intensity =
    35 + Math.sin(time * 12) * 10;

  dust.rotation.y=Math.sin(time*.12)*.013;
  lights.forEach((light, i) => {
    const flicker = Math.sin(time * 17 + i * 9) > .94 ? .05 : 1;
    light.intensity = (5 + Math.sin(time * 5 + i) * 3) * flicker;
  });

  if (started && !finished) {
    if (time < BLACKOUT_DURATION) {
      showStatus("");
      renderer.render(scene, camera);
      return;
    }
    elapsed += delta;

    /* PHASE 1: SLOW WALK TO DOOR */

    if (elapsed < 12) {
      const progress = smoothStep(elapsed / 12);

      camera.position.z = lerp(
        14,
        -12,
        progress
      );

      /* SUBTLE WALKING BOB */

      const bobStrength =
        Math.sin(Math.PI * progress);

      camera.position.y =
        1.7 +
        Math.sin(elapsed * 8) * .035 * bobStrength;

      camera.position.x =
        Math.sin(elapsed * 2) * .025 + Math.sin(elapsed * 31) * .009;

      camera.rotation.y =
        Math.sin(elapsed * .8) * .015;

      showStatus("SIGNAL LOST... KEEP WALKING...");
    }

    /* PHASE 2: DOOR OPENS */

    else if (elapsed < 15) {
      const progress = smoothStep(
        (elapsed - 12) / 3
      );

      doorPivot.rotation.y =
        -Math.PI / 2 * progress;

      camera.position.z = -12;
      camera.position.y = 1.7;
      camera.position.x = 0;
      camera.rotation.y = 0;

      showStatus("DOOR UNLOCKED... SOMETHING IS INSIDE");

      if (elapsed < 12.1 && !doorFlashed) {
        doorFlashed = true;
        triggerFlash();
      }
    }

    /* PHASE 3: ENTER ROOM */

    else if (elapsed < TOTAL_DURATION) {
      const progress = smoothStep(
        (elapsed - 15) / 5
      );

      doorPivot.rotation.y = -Math.PI / 2;

      camera.position.z = lerp(
        -12,
        -21,
        progress
      );

      camera.position.y =
        1.7 +
        Math.sin(elapsed * 7) * .025;

      camera.position.x = 0;
      camera.rotation.y = 0;

      showStatus("WARNING: UNAUTHORIZED PRESENCE DETECTED");
    }

    else {
      finishCinematic();
    }
  }

  renderer.render(scene, camera);
}

animate();

/* RESIZE */

window.addEventListener("resize", () => {
  camera.aspect =
    window.innerWidth / window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
});

</script>

</body>
</html>
